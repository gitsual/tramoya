<?xml version="1.0" encoding="UTF-8"?>
<!-- The banner. The mark is a stage seen from the fly loft: the curtain, the
     batten it hangs from, and the counterweight lines that raise it, the
     machinery nobody in the audience sees. Transparent field on purpose:
     GitHub paints the README white or black depending on the reader, so the
     wordmark takes the gold, which holds against both. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-label="tramoya">
  <defs>
    <linearGradient id="house" x2="0" y2="1"><stop stop-color="#1B1220"/><stop offset="1" stop-color="#2E1F33"/></linearGradient>
    <linearGradient id="velvet" x2="0" y2="1"><stop stop-color="#C9424F"/><stop offset="1" stop-color="#7E2733"/></linearGradient>
    <linearGradient id="fold" x2="1" y2="0"><stop stop-color="#000" stop-opacity=".28"/><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient>
    <radialGradient id="spot" cx=".5" cy=".1" r=".8"><stop stop-color="#E8C66A" stop-opacity=".55"/><stop offset="1" stop-color="#E8C66A" stop-opacity="0"/></radialGradient>
    <clipPath id="coin"><circle cx="130" cy="140" r="86"/></clipPath>
  </defs>

  <g clip-path="url(#coin)">
    <circle cx="130" cy="140" r="86" fill="url(#house)"/>
    <!-- stage floor and the spotlight pool -->
    <rect x="44" y="176" width="172" height="60" fill="#120B16"/>
    <ellipse cx="130" cy="180" rx="70" ry="16" fill="url(#spot)"/>
    <!-- counterweight lines from the grid -->
    <g stroke="#E8C66A" stroke-width="1.4" opacity=".7">
      <line x1="76" y1="54" x2="76" y2="96"/><line x1="104" y1="54" x2="104" y2="96"/>
      <line x1="156" y1="54" x2="156" y2="96"/><line x1="184" y1="54" x2="184" y2="96"/>
    </g>
    <!-- the batten -->
    <rect x="62" y="94" width="136" height="6" rx="3" fill="#E8C66A"/>
    <!-- the two curtain halves, gathered -->
    <path d="M64 100 H126 C122 130 118 160 108 182 H64 Z" fill="url(#velvet)"/>
    <path d="M64 100 H126 C122 130 118 160 108 182 H64 Z" fill="url(#fold)"/>
    <path d="M196 100 H134 C138 130 142 160 152 182 H196 Z" fill="url(#velvet)"/>
    <path d="M196 100 H134 C138 130 142 160 152 182 H196 Z" fill="url(#fold)"/>
    <!-- tie-backs -->
    <path d="M96 150 q12 -6 22 0" stroke="#E8C66A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M142 150 q12 -6 22 0" stroke="#E8C66A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- a pulley on the grid -->
    <circle cx="130" cy="66" r="9" fill="none" stroke="#E8C66A" stroke-width="3"/>
    <circle cx="130" cy="66" r="2.5" fill="#E8C66A"/>
    <line x1="130" y1="75" x2="130" y2="94" stroke="#E8C66A" stroke-width="1.4" opacity=".7"/>
  </g>
  <circle cx="130" cy="140" r="86" fill="none" stroke="#E8C66A" stroke-width="4"/>
  <circle cx="130" cy="140" r="106" fill="none" stroke="#E8C66A" stroke-width="1.5" opacity=".35"/>

  <text x="262" y="160" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace"
        font-size="84" font-weight="700" letter-spacing="-2" fill="#E8C66A">tramoya</text>
  <text x="266" y="202" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace"
        font-size="19" letter-spacing="4" fill="#B08D57">the machinery behind the take</text>
</svg>
