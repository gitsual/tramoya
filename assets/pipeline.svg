<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="tramoya pipeline">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#B08D57"/>
    </marker>
    <style>
      .box{fill:#2E1F33;stroke:#E8C66A;stroke-width:2;rx:14}
      .hot{fill:#7E2733;stroke:#E8C66A;stroke-width:2}
      .t{font-family:JetBrains Mono,ui-monospace,monospace;fill:#F4E9C8;font-size:22px;font-weight:700}
      .s{font-family:JetBrains Mono,ui-monospace,monospace;fill:#B08D57;font-size:12.5px}
      .w{stroke:#B08D57;stroke-width:2.5;fill:none;marker-end:url(#a)}
      .lbl{font-family:JetBrains Mono,ui-monospace,monospace;fill:#E8C66A;font-size:13px;letter-spacing:2px}
    </style>
  </defs>
  <rect width="1200" height="380" fill="#1B1220"/>
  <text x="600" y="38" text-anchor="middle" class="lbl">ON STAGE</text>
  <text x="600" y="228" text-anchor="middle" class="lbl">IN THE BOOTH</text>
  <line x1="40" y1="200" x2="1160" y2="200" stroke="#E8C66A" stroke-opacity=".25" stroke-dasharray="6 8"/>

  <rect x="40" y="60" width="220" height="110" class="box" rx="14"/>
  <text x="150" y="105" text-anchor="middle" class="t">direct</text>
  <text x="150" y="135" text-anchor="middle" class="s">Stage · Pacing · Narrator</text>
  <text x="150" y="155" text-anchor="middle" class="s">scenes run, marks flush</text>

  <rect x="330" y="60" width="220" height="110" class="box" rx="14"/>
  <text x="440" y="105" text-anchor="middle" class="t">record</text>
  <text x="440" y="135" text-anchor="middle" class="s">wf-recorder + offset sidecar</text>
  <text x="440" y="155" text-anchor="middle" class="s">take.mp4 · marks.json</text>

  <rect x="620" y="60" width="220" height="110" class="box" rx="14"/>
  <text x="730" y="105" text-anchor="middle" class="t">tts</text>
  <text x="730" y="135" text-anchor="middle" class="s">Kokoro, one wav per scene</text>
  <text x="730" y="155" text-anchor="middle" class="s">voices/&lt;lang&gt;/&lt;scene&gt;.wav</text>

  <rect x="910" y="60" width="250" height="110" class="hot" rx="14"/>
  <text x="1035" y="105" text-anchor="middle" class="t">assemble</text>
  <text x="1035" y="135" text-anchor="middle" class="s">cut per scene · fit the voice</text>
  <text x="1035" y="155" text-anchor="middle" class="s">compress the waits · concat</text>

  <path d="M260 115 H330" class="w"/>
  <path d="M550 115 H620" class="w"/>
  <path d="M840 115 H910" class="w"/>

  <rect x="40" y="250" width="250" height="100" class="box" rx="14"/>
  <text x="165" y="292" text-anchor="middle" class="t">deck</text>
  <text x="165" y="320" text-anchor="middle" class="s">slides + narration + the clip</text>

  <rect x="330" y="250" width="250" height="100" class="box" rx="14"/>
  <text x="455" y="292" text-anchor="middle" class="t">captions</text>
  <text x="455" y="320" text-anchor="middle" class="s">SRT / ASS · burn · trim</text>

  <rect x="620" y="250" width="250" height="100" class="box" rx="14"/>
  <text x="745" y="292" text-anchor="middle" class="t">music</text>
  <text x="745" y="320" text-anchor="middle" class="s">synth bed, ducked under voice</text>

  <rect x="910" y="250" width="250" height="100" class="hot" rx="14"/>
  <text x="1035" y="292" text-anchor="middle" class="t">demo.mp4</text>
  <text x="1035" y="320" text-anchor="middle" class="s">every ffmpeg call via Runner</text>

  <path d="M1035 170 V250" class="w"/>
  <path d="M290 300 H330" class="w"/>
  <path d="M580 300 H620" class="w"/>
  <path d="M870 300 H910" class="w"/>
  <path d="M1035 170 C1035 215 165 205 165 250" class="w"/>
</svg>
