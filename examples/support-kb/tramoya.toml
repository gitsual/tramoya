# Support knowledge base that does not rot. Three short "how do I" answers,
# regenerated by a nightly job against the current build. When the UI
# changes, the videos change with it; nobody has to notice first.

[app]
name = "Notes help"
launch = "python -m http.server 8773 --bind 127.0.0.1 --directory ../notes-app"
url = "http://127.0.0.1:8773/index.html"
viewport = [1280, 720]

[demo]
languages = ["en"]
pace = 1.0

[[scene]]
name = "how-do-i-search"
label = "How do I find a note?"
steps = ["point #search", "type #search | lightbulbs", "say 4", "beat 0.5", "clear #search"]

[scene.narration]
en = "To find a note, type part of its title or text in the search box. The list narrows as you type."

[[scene]]
name = "how-do-i-add"
label = "How do I add a note?"
steps = ["click_text New note", "beat 0.6", "type #title | Renew the parking permit",
         "type #text | Before the end of the month", "select #tag | home", "say 5",
         "click #save", "beat 1"]

[scene.narration]
en = "To add a note, press New note, give it a title, a line of text and a tag, then press Save. It appears at the top."

[[scene]]
name = "how-do-i-finish"
label = "How do I mark a note as done?"
steps = ["point button[data-toggle='4']", "say 4", "click button[data-toggle='4']", "beat 1"]

[scene.narration]
en = "To mark a note as done, press Done on its row. It is crossed out and moves to the Done view."
