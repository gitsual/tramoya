<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tramoya · estreno</title>
<style>
  /* El estreno: la toma se representa en una sala. Se abre el telón con el título, cada escena entra con su
     titular y su cue, la hoja de cues lleva la cuenta, las tablas marcan el avance y el telón cae al final.
     Todo es función de seek(t): el vídeo se graba fotograma a fotograma, igual en cada pasada. */
  @font-face { font-family: "Archivo"; src: url(fonts/Archivo-tramoya.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: "IBM Plex Mono"; src: url(fonts/IBMPlexMono-Medium.woff2) format("woff2"); font-weight: 400 700; }
  :root {
    --foco-100: #FAE5C3; --foco-300: #E8B456; --foco-400: #E9A80E; --foco-500: #B58203; --foco-600: #936906;
    --tablas-400: #A9A49B; --tablas-500: #908C83; --tablas-800: #33312D; --tablas-900: #211F1C;
    --sala-50: #E9F3FE; --sala-200: #B3CEEB; --sala-300: #93AECA; --sala-700: #1F4A70; --sala-800: #16334E; --sala-900: #0E2A47;
    --sombra: #05121F;
    --pliegues: repeating-linear-gradient(90deg, #16334E 0 20px, #0E2A47 20px 27px, #1F4A70 27px 30px, #16334E 30px 44px);
    --cartel: "Archivo", "Segoe UI", sans-serif; --mono: "IBM Plex Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--sala-900); color: var(--sala-50); font-family: var(--cartel); }
  html.vertical, .vertical body { width: 1080px; height: 1920px; }
  .cartel { font-family: var(--cartel); font-stretch: 66%; font-weight: 850; text-transform: uppercase; letter-spacing: .005em; }
  .etiqueta { font: 500 18px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; }

  /* La bambalina: la franja del telón de arriba, con su festón. */
  #bambalina { position: absolute; left: 0; right: 0; top: 0; height: 30px; background: var(--pliegues); z-index: 5; }
  #bambalina::after { content: ""; position: absolute; left: 0; right: 0; top: 30px; height: 14px;
    background: radial-gradient(circle at 22px -6px, var(--sala-800) 0 20px, transparent 21px) 0 0 / 44px 14px repeat-x; }
  /* Los telones de los lados, quietos: el marco de la sala. */
  .lado-telon { position: absolute; top: 0; bottom: 0; width: 26px; background: var(--pliegues); opacity: .9; }
  .lado-telon.izq { left: 0; } .lado-telon.der { right: 0; }

  /* La cabecera del programa de mano. */
  #cabecera { position: absolute; left: 64px; right: 64px; top: 58px; }
  #cabecera .fila { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; padding-bottom: 12px; }
  #presenta { color: var(--foco-300); white-space: nowrap; }
  #obra { font-size: 40px; line-height: 1; color: var(--sala-50); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  #cuenta { color: var(--sala-200); white-space: nowrap; }
  .vara { height: 4px; background: var(--foco-400); }
  .vara.fina { height: 1px; margin-top: 3px; background: var(--foco-600); }

  /* El titular de la escena. */
  #titular { position: absolute; left: 64px; top: 128px; width: 1376px; font-size: 62px; line-height: 1.0; color: var(--sala-50); }

  /* El escenario: la toma, con su marco de tablas y el foco encima. */
  #escenario { position: absolute; background: #000; outline: 10px solid var(--tablas-900); box-shadow: 0 0 0 11px var(--foco-600), 14px 14px 0 11px var(--sombra); }
  #escenario img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* El foco: un cono de luz que baja desde la vara sobre el escenario (detrás de la toma, no la lava). */
  #haz { position: absolute; pointer-events: none; filter: blur(16px);
    background: linear-gradient(180deg, rgba(250, 229, 195, .38), rgba(232, 180, 86, .16) 75%, rgba(232, 180, 86, 0));
    clip-path: polygon(43% 0, 57% 0, 100% 100%, 0 100%); }

  /* El sello del cue: cae sobre la esquina del escenario al entrar cada escena. */
  #sello { position: absolute; width: 176px; height: 176px; pointer-events: none; transform-origin: 50% 50%; z-index: 3; }

  /* La hoja de cues: lo hecho, lo que se está representando y lo que falta. */
  #hoja { position: absolute; overflow: hidden; }
  #hoja h2 { font-size: 34px; line-height: 1; padding-bottom: 10px; border-bottom: 3px solid var(--foco-400); color: var(--sala-50); }
  #cues { position: relative; margin-top: 8px; }
  .cue { position: absolute; left: 0; right: 0; display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: start;
    padding: 12px 12px 12px 10px; border-bottom: 1px solid var(--sala-700); }
  .cue .n { font: 600 17px/1.3 var(--mono); letter-spacing: .08em; color: var(--foco-300); }
  .cue .t { font-size: 20px; line-height: 1.25; font-weight: 500; color: var(--sala-200); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cue.hecha .t { color: var(--sala-300); }
  .cue.hecha .n::after { content: " ✓"; color: var(--sala-300); }
  .cue.ahora { background: var(--foco-400); border-bottom-color: var(--foco-400); }
  .cue.ahora .n, .cue.ahora .t { color: var(--tablas-900); }
  .cue.ahora .t { font-weight: 700; }

  /* En vertical, en vez de la hoja: lo que sigue, debajo del escenario. */
  #sigue { position: absolute; display: none; }
  #sigue .etiqueta { color: var(--foco-300); }
  #sigue .t { margin-top: 10px; font-size: 34px; line-height: 1.15; font-weight: 600; color: var(--sala-200); }

  /* Las tablas: el suelo del escenario, con una luz por escena. */
  #tablas { position: absolute; left: 0; right: 0; top: 1018px; height: 62px;
    background: repeating-linear-gradient(90deg, var(--tablas-900) 0 158px, #191816 158px 160px); }
  #tablas .fill { position: absolute; left: 0; top: 0; height: 3px; background: var(--foco-400); }
  #tablas .luces { position: absolute; left: 200px; right: 200px; top: 0; bottom: 0; }
  #tablas .luz { position: absolute; top: 22px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; border: 2px solid var(--tablas-500); }
  #tablas .luz.on { border-color: var(--foco-400); background: var(--foco-400); box-shadow: 0 0 14px 2px rgba(233, 168, 14, .55); }
  #tablas .tiempos { position: absolute; left: 64px; right: 64px; top: 0; bottom: 0; display: flex; justify-content: space-between;
    align-items: center; color: var(--tablas-400); font-size: 16px; }

  /* El telón: cerrado al empezar, se abre; cae al terminar. */
  .telon { position: absolute; top: 0; bottom: 0; width: 50.5%; z-index: 10;
    background: linear-gradient(90deg, rgba(5, 18, 31, .55), transparent 18%, transparent 82%, rgba(5, 18, 31, .55)), var(--pliegues); }
  .telon::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 40%;
    background: linear-gradient(180deg, transparent, rgba(5, 18, 31, .6)); }
  #telon-izq { left: 0; } #telon-der { right: 0; }
  #telon-foco { position: absolute; left: 50%; bottom: -160px; width: 1500px; height: 520px; margin-left: -750px; z-index: 11; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, rgba(250, 229, 195, .30), rgba(250, 229, 195, .08) 45%, transparent 70%); }
  .cartela { position: absolute; left: 0; right: 0; top: 0; bottom: 0; z-index: 12; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 0 160px; pointer-events: none; }
  .cartela .etiqueta { color: var(--foco-300); font-size: 22px; }
  .cartela h1 { margin-top: 26px; font-size: 168px; line-height: .9; color: var(--foco-100); text-shadow: 6px 6px 0 var(--sombra); }
  .cartela .raya { margin-top: 30px; height: 4px; width: 0; background: var(--foco-400); }
  .cartela p { margin-top: 24px; font: 500 22px/1.4 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--sala-200); }
  #cierre h1 { font-size: 220px; }
  #cierre #cierre-e { margin-top: 18px; font-size: 26px; }
  #cierre .datos { margin-top: 30px; display: flex; gap: 0; }
  #cierre .datos div { padding: 0 34px; border-right: 1px solid var(--sala-300); text-align: center; font: 500 16px var(--mono);
    letter-spacing: .16em; text-transform: uppercase; color: var(--sala-200); }
  #cierre .datos div:last-child { border-right: 0; }
  #cierre .datos strong { display: block; margin-bottom: 8px; font-family: var(--cartel); font-stretch: 66%; font-weight: 850;
    font-size: 64px; line-height: 1; letter-spacing: 0; color: var(--sala-50); }
  #cierre .firma { margin-top: 40px; font-size: 16px; color: var(--foco-300); }

  .vertical #cabecera { left: 48px; right: 48px; top: 60px; }
  .vertical #cabecera .fila { flex-wrap: wrap; row-gap: 14px; }
  .vertical #obra { order: 3; flex-basis: 100%; font-size: 52px; }
  .vertical #titular { left: 48px; top: 222px; width: 790px; font-size: 56px; line-height: 1.02; }
  .vertical #hoja { display: none; }
  .vertical #sigue { display: block; }
  .vertical #tablas { top: 1858px; }
  .vertical #tablas .luces { left: 150px; right: 150px; }
  .vertical #tablas .tiempos { left: 48px; right: 48px; }
  .vertical .lado-telon { width: 18px; }
  .vertical .cartela { padding: 0 90px; }
  .vertical .cartela h1 { font-size: 150px; }
  .vertical #cierre h1 { font-size: 200px; }
  .vertical #cierre .datos { flex-direction: column; gap: 26px; }
  .vertical #cierre .datos div { border-right: 0; }
  .vertical #telon-foco { width: 1100px; margin-left: -550px; }
</style>
</head>
<body>
<div class="lado-telon izq"></div><div class="lado-telon der"></div>
<div id="haz"></div>
<div id="bambalina"></div>
<div id="cabecera">
  <div class="fila"><span id="presenta" class="etiqueta"></span><span id="obra" class="cartel"></span><span id="cuenta" class="etiqueta"></span></div>
  <div class="vara"></div><div class="vara fina"></div>
</div>
<div id="titular" class="cartel"></div>
<div id="escenario"><img id="toma" alt=""></div>
<svg id="sello" viewBox="0 0 240 240" aria-hidden="true">
  <defs>
    <path id="arco" d="M 36 120 A 84 84 0 0 1 204 120"></path>
    <path id="arco2" d="M 30 128 A 90 90 0 0 0 210 128"></path>
  </defs>
  <circle cx="120" cy="120" r="112" fill="#0E2A47" stroke="#E9A80E" stroke-width="6"></circle>
  <circle cx="120" cy="120" r="100" fill="none" stroke="#E9A80E" stroke-width="1.6"></circle>
  <circle cx="120" cy="120" r="58" fill="#E9A80E"></circle>
  <text fill="#E8B456" font-family="IBM Plex Mono, monospace" font-size="17" font-weight="600" letter-spacing="5"><textPath href="#arco" startOffset="50%" text-anchor="middle">TRAMOYA</textPath></text>
  <text fill="#E8B456" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="4"><textPath href="#arco2" startOffset="50%" text-anchor="middle" id="sello-pie"></textPath></text>
  <text x="120" y="122" fill="#211F1C" text-anchor="middle" dominant-baseline="middle" font-family="Archivo, sans-serif" font-stretch="66%" font-weight="850" font-size="54" id="sello-n"></text>
</svg>
<div id="hoja"><h2 class="cartel" id="hoja-t"></h2><div id="cues"></div></div>
<div id="sigue"><div class="etiqueta" id="sigue-e"></div><div class="t" id="sigue-t"></div></div>
<div id="tablas"><div class="fill"></div><div class="luces"></div><div class="tiempos etiqueta"><span id="t-a"></span><span id="t-b"></span></div></div>
<div class="telon" id="telon-izq"></div><div class="telon" id="telon-der"></div>
<div id="telon-foco"></div>
<div class="cartela" id="entrada">
  <div class="etiqueta" id="entrada-e"></div><h1 class="cartel" id="entrada-h"></h1><div class="raya"></div><p id="entrada-p"></p>
</div>
<div class="cartela" id="cierre">
  <h1 class="cartel" id="cierre-h"></h1><div class="etiqueta" id="cierre-e"></div><div class="datos" id="cierre-d"></div><div class="etiqueta firma" id="cierre-f"></div>
</div>
<script>
const $ = id => document.getElementById(id)
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2 }
const entra = x => { x = clamp(x); return 1 - Math.pow(1 - x, 3) }   // el telón sube frenando
const sale = x => { x = clamp(x); return x * x * x }                 // y cae con peso
const lerp = (a, b, k) => a + (b - a) * k
const reloj = ms => { const s = Math.round(ms / 1000); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}` }
const tr = (k, v = {}) => (D.t?.[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '')
/** Reduce la letra hasta que el texto quepa en `ancho` x `alto`. */
function encajar (el, ancho, alto = Infinity) {
  el.style.fontSize = ''
  let px = parseFloat(getComputedStyle(el).fontSize)
  while ((el.scrollWidth > ancho || el.scrollHeight > alto) && px > 20) { px -= 2; el.style.fontSize = `${px}px` }
}
const giro = i => [-8, 6, -11, 4, -5, 9, -3, 7][i % 8]

let D, E = [], VIDEO = 0, FIN = 0, CAJA, L
window.duration = 0

/** Las medidas de cada lienzo: dónde va el escenario y cuánto puede ocupar el titular. */
const LIENZOS = {
  horizontal: { caja: { x: 64, y: 272, w: 1376, h: 716 }, titular: [1376, 132], cartel: 1600, columna: 48 },
  vertical: { caja: { x: 48, y: 420, w: 984, h: 1230 }, titular: [790, 176], cartel: 900 }
}

async function load () {
  D = await (await fetch('datos.json')).json()
  L = LIENZOS[D.formato] || LIENZOS.horizontal
  if (D.formato === 'vertical') document.documentElement.classList.add('vertical')
  E = D.escenas
  VIDEO = D.frames * 1000 / D.fps / D.vel
  FIN = D.intro + VIDEO
  window.duration = FIN + D.outro
  await Promise.all(['850 62px Archivo', '600 20px Archivo', '18px "IBM Plex Mono"'].map(f => document.fonts.load(f).catch(() => {})))

  // El escenario encaja la toma sin deformarla; en horizontal, la hoja de cues ocupa lo que queda a la derecha.
  const c = L.caja, k = Math.min(c.w / D.video.w, c.h / D.video.h)
  CAJA = { x: c.x, y: c.y, w: Math.round(D.video.w * k), h: Math.round(D.video.h * k) }
  if (D.formato === 'vertical') CAJA.x = Math.round((D.ancho - CAJA.w) / 2)
  Object.assign($('escenario').style, { left: `${CAJA.x}px`, top: `${CAJA.y}px`, width: `${CAJA.w}px`, height: `${CAJA.h}px` })
  Object.assign($('haz').style, { left: `${CAJA.x - 60}px`, top: '40px', width: `${CAJA.w + 120}px`, height: `${CAJA.y + CAJA.h * .5 - 40}px` })
  Object.assign($('sello').style, { left: `${CAJA.x + CAJA.w - 132}px`, top: `${CAJA.y - 128}px` })
  if (D.formato === 'vertical') {
    Object.assign($('sello').style, { left: `${D.ancho - 48 - 176}px`, top: '206px' })
    Object.assign($('sigue').style, { left: `${CAJA.x}px`, top: `${CAJA.y + CAJA.h + 74}px`, width: `${CAJA.w}px` })
  } else {
    const x = CAJA.x + CAJA.w + 10 + L.columna
    Object.assign($('hoja').style, { left: `${x}px`, top: `${CAJA.y - 8}px`, width: `${D.ancho - 64 - x}px`, height: `${CAJA.h + 16}px` })
  }

  $('presenta').textContent = tr('presenta'); $('obra').textContent = D.titulo
  $('hoja-t').textContent = tr('hoja'); $('sigue-e').textContent = tr('sigue')
  $('cues').innerHTML = E.map((e, i) => `<div class="cue"><div class="n">Q${String(i + 1).padStart(2, '0')}</div><div class="t"></div></div>`).join('')
  ;[...$('cues').children].forEach((el, i) => { el.querySelector('.t').textContent = E[i].texto || D.titulo })
  const luces = $('tablas').querySelector('.luces')
  E.forEach(e => { const d = document.createElement('div'); d.className = 'luz'; d.style.left = `${e.ini / VIDEO * 100}%`; luces.appendChild(d) })
  $('t-a').textContent = '00:00'; $('t-b').textContent = reloj(VIDEO)

  $('entrada-e').textContent = tr('presenta'); $('entrada-h').textContent = D.titulo
  $('entrada-p').textContent = [D.lugar, D.fecha].filter(Boolean).join(' · ')
  encajar($('entrada-h'), L.cartel, D.formato === 'vertical' ? 640 : 330)
  $('cierre-e').textContent = tr('funcion'); $('cierre-h').textContent = tr('fin')
  $('cierre-d').innerHTML = [[E.length, tr(E.length === 1 ? 'escena' : 'escenas')], [reloj(VIDEO), tr('duracion')], [D.fecha_corta, tr('estreno')]]
    .map(([n, l]) => `<div><strong>${n}</strong>${l}</div>`).join('')
  $('cierre-f').textContent = tr('hecho')
  window.ready = true
}

function poner (img, src) {
  if (img.dataset.src === src) return null
  img.dataset.src = src; img.src = src
  return img.decode().catch(() => {})
}

/** Pinta el instante t (ms). Devuelve una promesa que se cumple cuando el fotograma de la toma está pintado. */
function seek (t) {
  const local = clamp(t - D.intro, 0, VIDEO)
  const f = Math.min(D.frames - 1, Math.floor(local * D.vel * D.fps / 1000))
  const espera = poner($('toma'), `frames/${String(f + 1).padStart(5, '0')}.jpg`)

  let i = 0
  while (i + 1 < E.length && E[i + 1].ini <= local) i++
  const e = E[i], enEscena = t < D.intro ? 0 : local - e.ini

  // La cabecera y el titular: entra de abajo cada vez que cambia la escena.
  $('cuenta').textContent = tr('cuenta', { i: i + 1, n: E.length })
  const r = $('titular')
  if (r.dataset.i !== String(i)) { r.dataset.i = i; r.textContent = e.texto || D.titulo; encajar(r, ...L.titular) }
  const kr = ease(enEscena / 450)
  r.style.opacity = kr; r.style.transform = `translateY(${lerp(16, 0, kr)}px)`

  // El foco: un golpe de luz al entrar la escena que se queda en penumbra.
  $('haz').style.opacity = lerp(1, .45, ease((enEscena - 150) / 1100))

  // El sello del cue cae sobre la esquina.
  $('sello-n').textContent = `Q${i + 1}`
  $('sello-pie').textContent = tr('cuenta', { i: i + 1, n: E.length })
  const ks = clamp((enEscena - 250) / 220), sello = $('sello')
  sello.style.opacity = ks
  sello.style.transform = `rotate(${giro(i)}deg) scale(${lerp(1.6, 1, ease(ks))})`

  // La hoja de cues: la fila de ahora se ilumina y la lista sube para que siga a la vista.
  const filas = [...$('cues').children]
  let y = 0
  const alturas = filas.map(el => { const h = el.offsetHeight; el.style.top = `${y}px`; y += h; return h })
  filas.forEach((el, j) => { el.classList.toggle('hecha', j < i); el.classList.toggle('ahora', j === i) })
  const hoja = $('hoja')
  if (hoja.offsetHeight) {
    const visible = hoja.offsetHeight - 60, arriba = alturas.slice(0, i).reduce((a, b) => a + b, 0)
    const destino = Math.max(0, Math.min(arriba - visible * .35, y - visible))
    const antes = alturas.slice(0, Math.max(0, i - 1)).reduce((a, b) => a + b, 0)
    const desde = Math.max(0, Math.min(antes - visible * .35, y - visible))
    $('cues').style.transform = `translateY(${-lerp(desde, destino, ease(enEscena / 500))}px)`
  }
  const sig = E[i + 1]
  $('sigue-t').textContent = sig ? (sig.texto || D.titulo) : tr('fin')
  $('sigue').style.opacity = ease((enEscena - 600) / 500)

  // Las tablas: el avance y una luz por escena.
  $('tablas').querySelector('.fill').style.width = `${clamp(local / VIDEO) * 100}%`
  $('tablas').querySelectorAll('.luz').forEach((d, j) => d.classList.toggle('on', local >= E[j].ini))
  $('t-a').textContent = reloj(local)

  // El telón: cerrado con el título; se abre al terminar la entrada y cae al final.
  const abre = entra((t - (D.intro - 1100)) / 1000)
  const cae = sale((t - FIN) / 900)
  const cerrado = t < FIN ? 1 - abre : cae
  $('telon-izq').style.transform = `translateX(${-100 * (1 - cerrado)}%)`
  $('telon-der').style.transform = `translateX(${100 * (1 - cerrado)}%)`
  $('telon-foco').style.opacity = cerrado
  const ke = t < D.intro ? clamp(1 - (t - (D.intro - 1300)) / 400) : 0
  $('entrada').style.opacity = ke
  $('entrada-e').style.opacity = ease(t / 500)
  const kh = ease((t - 200) / 700)
  $('entrada-h').style.opacity = kh; $('entrada-h').style.transform = `translateY(${lerp(40, 0, kh)}px)`
  $('entrada').querySelector('.raya').style.width = `${lerp(0, Math.min(640, L.cartel * .6), ease((t - 500) / 600))}px`
  $('entrada-p').style.opacity = ease((t - 800) / 500)
  const o = t - FIN
  $('cierre').style.opacity = o > 0 ? ease((o - 700) / 500) : 0
  const kc = ease((o - 800) / 600)
  $('cierre-h').style.transform = `translateY(${lerp(30, 0, kc)}px)`
  $('cierre-e').style.opacity = ease((o - 1100) / 500)
  $('cierre-d').style.opacity = ease((o - 1300) / 600)
  $('cierre-f').style.opacity = ease((o - 1800) / 600)
  return Promise.all([espera].filter(Boolean))
}

window.seek = seek
load().then(() => seek(0))
</script>
