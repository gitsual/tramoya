<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tramoya</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237A2635'/%3E%3Cpath d='M8 8h16v3c-2 0-3 2-3 5s1 7 3 8H8c2-1 3-5 3-8s-1-5-3-5z' fill='%23F3E3C3'/%3E%3C/svg%3E">
<style>
:root {
  --papel: #F5F2EC;
  --hoja: #FFFFFF;
  --tinta: #1F1A17;
  --suave: #6E655D;
  --tenue: #A39A90;
  --linea: #E7E1D7;
  --linea-2: #D9D1C4;
  --telon: #7A2635;
  --telon-2: #93303F;
  --telon-claro: #F6E9EA;
  --oro: #B8893A;
  --oro-claro: #F7EEDC;
  --verde: #2E6B4F;
  --verde-claro: #E6F1EA;
  --rojo: #C8413B;
  --rojo-claro: #FBEAE8;
  --sombra: 0 1px 2px rgba(31,26,23,.05), 0 8px 24px rgba(31,26,23,.06);
  --radio: 14px;
  --fuente: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --titular: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--papel); color: var(--tinta);
  font: 15px/1.5 var(--fuente); -webkit-font-smoothing: antialiased;
  display: grid; grid-template-columns: 272px 1fr; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--telon); outline-offset: 2px; border-radius: 6px; }

/* ---------- lateral ---------- */
aside {
  border-right: 1px solid var(--linea); background: #FBF9F5;
  display: flex; flex-direction: column; min-height: 0;
}
.marca { display: flex; align-items: center; gap: 11px; padding: 24px 22px 20px; }
.marca svg { flex: none; }
.marca b { font: 600 20px/1 var(--titular); letter-spacing: -.01em; }
.marca small { display: block; color: var(--suave); font-size: 12.5px; margin-top: 3px; }
.nuevo {
  margin: 0 16px 18px; padding: 11px 14px; border: 0; border-radius: 11px;
  background: var(--telon); color: #fff; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 1px 0 rgba(255,255,255,.15) inset, 0 4px 14px rgba(122,38,53,.25);
  transition: background .15s, transform .15s;
}
.nuevo:hover { background: var(--telon-2); }
.nuevo:active { transform: translateY(1px); }
.titulo-lista { padding: 0 22px 8px; font-size: 12px; font-weight: 600; color: var(--tenue); letter-spacing: .06em; text-transform: uppercase; }
#lista { flex: 1; overflow: auto; padding: 0 10px 10px; }
.item {
  width: 100%; text-align: left; border: 0; background: none; border-radius: 10px;
  padding: 10px 12px; display: flex; gap: 10px; align-items: center; margin-bottom: 2px;
}
.item:hover { background: #F1ECE4; }
.item.activo { background: var(--hoja); box-shadow: var(--sombra); }
.item .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--linea-2); flex: none; }
.item .punto.listo { background: var(--verde); }
.item .punto.vivo { background: var(--rojo); animation: latido 1.2s infinite; }
.item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item small { display: block; color: var(--tenue); font-size: 12px; }
.vacio-lista { padding: 8px 22px; color: var(--tenue); font-size: 13.5px; }
.pie-lateral { border-top: 1px solid var(--linea); padding: 12px 16px; }
.enlace {
  border: 0; background: none; color: var(--suave); padding: 6px 6px; border-radius: 8px;
  display: inline-flex; gap: 8px; align-items: center; font-size: 13.5px;
}
.enlace:hover { color: var(--tinta); background: #F1ECE4; }

/* ---------- principal ---------- */
main { overflow: auto; min-height: 0; }
.lienzo { max-width: 780px; margin: 0 auto; padding: 36px 40px 120px; }
h1 { font: 600 30px/1.2 var(--titular); letter-spacing: -.02em; margin: 0 0 8px; }
h2 { font: 600 20px/1.3 var(--titular); margin: 0 0 6px; }
.sub { color: var(--suave); margin: 0 0 26px; font-size: 15.5px; max-width: 60ch; }

.pasos-guia { display: flex; gap: 6px; margin: 0 0 28px; padding: 0; list-style: none; }
.pasos-guia li {
  flex: 1; display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  border-radius: 12px; color: var(--tenue); font-weight: 600; font-size: 14px;
  background: transparent; border: 1px solid transparent; cursor: default;
}
.pasos-guia li.hecho { color: var(--verde); cursor: pointer; }
.pasos-guia li.hecho:hover { background: #EFEAE1; }
.pasos-guia li.ahora { color: var(--tinta); background: var(--hoja); border-color: var(--linea); box-shadow: var(--sombra); }
.pasos-guia .n {
  width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  font-size: 12.5px; border: 1.5px solid currentColor; flex: none;
}
.pasos-guia li.ahora .n { background: var(--telon); border-color: var(--telon); color: #fff; }
.pasos-guia li.hecho .n { background: var(--verde); border-color: var(--verde); color: #fff; }

.tarjeta {
  background: var(--hoja); border: 1px solid var(--linea); border-radius: var(--radio);
  box-shadow: var(--sombra); padding: 26px 28px;
}
.tarjeta + .tarjeta { margin-top: 16px; }

.campo { display: block; margin-bottom: 20px; }
.campo > span { display: block; font-weight: 600; margin-bottom: 7px; }
.campo > small { display: block; color: var(--suave); margin-top: 6px; font-size: 13px; }
input[type=text], textarea {
  width: 100%; font: inherit; color: var(--tinta); background: #FDFCFA;
  border: 1px solid var(--linea-2); border-radius: 10px; padding: 11px 13px;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
input[type=text]:focus, textarea:focus {
  outline: none; border-color: var(--telon); background: #fff;
  box-shadow: 0 0 0 4px rgba(122,38,53,.10);
}
textarea { resize: none; min-height: 46px; line-height: 1.45; overflow: hidden; }
::placeholder { color: #B3AAA0; }

.botones { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.btn {
  border: 1px solid var(--linea-2); background: var(--hoja); border-radius: 11px;
  padding: 11px 18px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;
  transition: background .15s, border-color .15s, transform .15s;
}
.btn:hover { background: #F7F4EF; border-color: var(--tenue); }
.btn:active { transform: translateY(1px); }
.btn.principal { background: var(--telon); border-color: var(--telon); color: #fff; box-shadow: 0 4px 14px rgba(122,38,53,.22); }
.btn.principal:hover { background: var(--telon-2); }
.btn.grande { padding: 14px 24px; font-size: 16px; border-radius: 13px; }
.btn.discreto { border-color: transparent; background: none; color: var(--suave); }
.btn.discreto:hover { background: #EFEAE1; color: var(--tinta); }
.btn[disabled] { opacity: .5; pointer-events: none; }
.derecha { margin-left: auto; }

/* portada */
.portada { text-align: center; padding: 56px 20px 10px; }
.portada h1 { font-size: 36px; max-width: 18ch; margin: 22px auto 12px; }
.portada .sub { margin: 0 auto 34px; }
.tres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 48px; text-align: left; }
.tres .tarjeta { padding: 20px; }
.tres b { display: block; margin: 12px 0 4px; }
.tres p { margin: 0; color: var(--suave); font-size: 14px; }
.icono-redondo { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--telon-claro); color: var(--telon); }
.icono-redondo.oro { background: var(--oro-claro); color: var(--oro); }
.icono-redondo.verde { background: var(--verde-claro); color: var(--verde); }

/* instrucciones numeradas */
.lista-num { list-style: none; padding: 0; margin: 4px 0 24px; counter-reset: n; }
.lista-num li { counter-increment: n; display: flex; gap: 14px; padding: 9px 0; }
.lista-num li::before {
  content: counter(n); flex: none; width: 26px; height: 26px; border-radius: 50%;
  background: var(--oro-claro); color: var(--oro); font-weight: 700; font-size: 13px;
  display: grid; place-items: center; margin-top: 1px;
}

/* grabando */
.en-vivo { display: flex; align-items: center; gap: 18px; margin-bottom: 18px; }
.anillo { position: relative; width: 54px; height: 54px; flex: none; }
.anillo::before, .anillo::after { content: ""; position: absolute; inset: 0; border-radius: 50%; }
.anillo::before { background: var(--rojo); inset: 15px; }
.anillo::after { border: 2px solid var(--rojo); animation: onda 1.6s ease-out infinite; }
@keyframes onda { from { transform: scale(.45); opacity: .9; } to { transform: scale(1); opacity: 0; } }
@keyframes latido { 50% { opacity: .35; } }
.consejos { display: grid; gap: 10px; margin: 6px 0 24px; }
.consejo { display: flex; gap: 12px; padding: 12px 14px; background: #FBF9F5; border: 1px solid var(--linea); border-radius: 11px; font-size: 14.5px; }
.consejo svg { flex: none; color: var(--oro); margin-top: 2px; }

.girando { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--linea-2); border-top-color: var(--telon); animation: gira .8s linear infinite; flex: none; }
@keyframes gira { to { transform: rotate(360deg); } }

/* avisos */
.aviso { display: flex; gap: 12px; padding: 13px 16px; border-radius: 12px; margin-bottom: 16px; font-size: 14.5px; }
.aviso svg { flex: none; margin-top: 2px; }
.aviso.info { background: var(--oro-claro); color: #6D5222; }
.aviso.mal { background: var(--rojo-claro); color: #8A2B26; }
.aviso.bien { background: var(--verde-claro); color: #22513C; }
.aviso p { margin: 0; }
.aviso p + p { margin-top: 4px; }

/* pasos a explicar */
.cabecera-pasos { display: flex; align-items: end; gap: 16px; margin-bottom: 14px; }
.contador { color: var(--suave); font-size: 13.5px; white-space: nowrap; }
.paso {
  display: grid; grid-template-columns: 34px 1fr; gap: 6px 14px;
  background: var(--hoja); border: 1px solid var(--linea); border-radius: var(--radio);
  padding: 16px 18px; margin-bottom: 10px; transition: border-color .2s, box-shadow .2s, opacity .2s;
}
.paso:focus-within { border-color: var(--linea-2); box-shadow: var(--sombra); }
.paso.fallo { border-color: var(--rojo); box-shadow: 0 0 0 4px rgba(200,65,59,.12); }
.paso .num {
  width: 30px; height: 30px; border-radius: 9px; background: #F3EFE8; color: var(--suave);
  display: grid; place-items: center; font-weight: 700; font-size: 13px; grid-row: span 2;
}
.paso.con-texto .num { background: var(--telon); color: #fff; }
.paso .que { display: flex; align-items: center; gap: 10px; min-height: 30px; }
.paso .que b { font-weight: 600; flex: 1; overflow-wrap: anywhere; }
.paso .acciones { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
.paso.quitado { opacity: .55; }
.paso.tecla { padding: 8px 18px; background: transparent; border-style: dashed; }
.paso.tecla .num { grid-row: auto; width: 26px; height: 26px; font-size: 12px; }
.paso.tecla b { font-weight: 500; color: var(--suave); }
.paso.quitado .num { background: none; border: 1.5px dashed var(--linea-2); }
.paso.quitado b { text-decoration: line-through; color: var(--suave); font-weight: 500; }
.chip {
  border: 1px solid var(--linea); background: #FBF9F5; border-radius: 999px;
  padding: 5px 11px; font-size: 13px; color: var(--suave);
  display: inline-flex; gap: 6px; align-items: center; transition: all .15s;
}
.chip:hover { border-color: var(--linea-2); color: var(--tinta); }
.chip.on { background: var(--oro-claro); border-color: #E7D3AA; color: #6D5222; }
.chip .marca-check { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid currentColor; display: grid; place-items: center; }
.chip.on .marca-check { background: var(--oro); border-color: var(--oro); color: #fff; }
.pista { font-size: 12.5px; color: var(--tenue); }
.barra-fija {
  position: sticky; bottom: 0; margin: 18px -40px 0; padding: 16px 40px;
  background: linear-gradient(to bottom, rgba(245,242,236,0), var(--papel) 30%);
  display: flex; gap: 10px; align-items: center;
}

/* interruptor */
.opcion { display: flex; gap: 16px; align-items: center; padding: 16px 18px; border: 1px solid var(--linea); border-radius: 12px; background: #FDFCFA; margin-bottom: 20px; }
.opcion div { flex: 1; }
.opcion b { display: block; }
.opcion small { color: var(--suave); font-size: 13.5px; }
.interruptor { position: relative; width: 46px; height: 26px; flex: none; }
.interruptor input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.interruptor span { position: absolute; inset: 0; border-radius: 99px; background: var(--linea-2); transition: background .2s; pointer-events: none; }
.interruptor span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
.interruptor input:checked + span { background: var(--verde); }
.interruptor input:checked + span::after { transform: translateX(20px); }
.interruptor input:focus-visible + span { outline: 2px solid var(--telon); outline-offset: 2px; }
.interruptor input:disabled { cursor: not-allowed; }

/* progreso */
.progreso { height: 10px; background: #EFEAE1; border-radius: 99px; overflow: hidden; margin: 18px 0 10px; }
.progreso i { display: block; height: 100%; background: linear-gradient(90deg, var(--telon), var(--oro)); border-radius: 99px; transition: width .6s ease; }
.fases { display: flex; gap: 18px; font-size: 13.5px; color: var(--tenue); margin-top: 14px; }
.fases span.ya { color: var(--verde); }
.fases span.ahora { color: var(--tinta); font-weight: 600; }

video { width: 100%; border-radius: 12px; background: #000; display: block; margin-bottom: 18px; aspect-ratio: 16/10; }
.fila { display: flex; gap: 12px; align-items: center; }
.oculto { display: none !important; }
.webs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.web { border: 1px solid var(--linea-2); background: #FDFCFA; border-radius: 10px; padding: 9px 13px; display: inline-flex; gap: 7px; align-items: center; font-weight: 500; transition: all .15s; }
.web:hover { border-color: var(--tenue); }
.web.on { border-color: var(--telon); background: var(--telon-claro); color: var(--telon); font-weight: 600; }
.marcador { text-align: center; line-height: 1; }
.marcador b { display: block; font: 600 30px/1 var(--titular); color: var(--telon); }
.marcador small { color: var(--suave); font-size: 12.5px; }
.ultimo { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 11px; background: var(--verde-claro); color: #22513C; margin-bottom: 14px; font-weight: 500; }
.ultimo.espera { background: #F3EFE8; color: var(--suave); font-weight: 400; }
.ultimo.nuevo { animation: destello .6s ease; }
@keyframes destello { from { box-shadow: 0 0 0 4px rgba(46,107,79,.25); } }
.punto-rojo { width: 10px; height: 10px; border-radius: 50%; background: #FF8A80; box-shadow: 0 0 0 3px rgba(255,255,255,.25); }
a { color: var(--telon); }

.dialogo-fondo { position: fixed; inset: 0; background: rgba(31,26,23,.35); display: grid; place-items: center; z-index: 10; animation: aparece .15s; }
.dialogo { background: var(--hoja); border-radius: 16px; padding: 24px 26px; width: min(420px, 90vw); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.dialogo p { color: var(--suave); margin: 6px 0 20px; }
@keyframes aparece { from { opacity: 0; } }
.vista { animation: entra .25s ease; }
@keyframes entra { from { opacity: 0; transform: translateY(6px); } }

/* cabecera con acciones */
.titular { display: flex; align-items: flex-start; gap: 12px; }
.titular h1 { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.titular h1 input { font: inherit; letter-spacing: inherit; width: 100%; border: 1px solid var(--linea-2); border-radius: 10px; padding: 2px 10px; background: #fff; }
.menu { position: relative; }
.menu-lista { position: absolute; right: 0; top: 42px; background: var(--hoja); border: 1px solid var(--linea); border-radius: 12px; box-shadow: 0 12px 32px rgba(31,26,23,.14); padding: 6px; min-width: 210px; z-index: 5; animation: aparece .12s; }
.menu-lista button { width: 100%; text-align: left; border: 0; background: none; padding: 9px 12px; border-radius: 8px; display: flex; gap: 10px; align-items: center; }
.menu-lista button:hover { background: #F3EFE8; }
.menu-lista button.peligro { color: var(--rojo); }
.icono-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid transparent; background: none; display: grid; place-items: center; color: var(--suave); margin-top: 2px; }
.icono-btn:hover { background: #EFEAE1; color: var(--tinta); }

/* ajustes */
.dialogo.ancho { width: min(560px, 94vw); max-height: 90vh; overflow: auto; }
.ajuste { padding: 16px 0; border-top: 1px solid var(--linea); }
.ajuste:first-of-type { border-top: 0; padding-top: 4px; }
.ajuste > b { display: block; margin-bottom: 4px; }
.ajuste > small { display: block; color: var(--suave); font-size: 13px; margin-bottom: 10px; }
select { font: inherit; color: var(--tinta); width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--linea-2); background: #FDFCFA; }
.segmentos { display: inline-flex; background: #F1ECE4; border-radius: 11px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.segmentos button { border: 0; background: none; padding: 8px 14px; border-radius: 9px; font-weight: 500; color: var(--suave); }
.segmentos button.on { background: var(--hoja); color: var(--tinta); font-weight: 600; box-shadow: 0 1px 3px rgba(31,26,23,.12); }
input[type=range] { width: 100%; accent-color: var(--telon); }
.escala { display: flex; justify-content: space-between; font-size: 12px; color: var(--tenue); margin-top: 2px; }
details summary { cursor: pointer; color: var(--suave); font-weight: 600; padding: 6px 0; }

/* valor de un campo */
.valor { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; font-size: 13.5px; color: var(--suave); }
.valor input { flex: 1; padding: 7px 10px !important; font-size: 14px; }

/* aviso flotante */
#aviso-flotante { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: var(--tinta); color: #fff; padding: 12px 18px; border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,.25); opacity: 0; transition: all .25s; pointer-events: none; z-index: 20; font-weight: 500; }
#aviso-flotante.ver { opacity: 1; transform: translateX(-50%); }
.buscar { margin: 0 16px 10px; }
.buscar input { padding: 8px 11px; font-size: 13.5px; }

@media (max-width: 860px) {
  body { grid-template-columns: 1fr; overflow: auto; }
  aside { display: none; }
  .lienzo { padding: 24px 18px 100px; }
  .tres { grid-template-columns: 1fr; }
  .barra-fija { margin: 18px -18px 0; padding: 14px 18px; }
}
</style>
</head>
<body>

<aside>
  <div class="marca">
    <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#7A2635"/><path d="M7 7h18v2.6c-2.4.3-3.6 2.8-3.6 6.4 0 3.4 1.2 7.2 3.6 9H7c2.4-1.8 3.6-5.6 3.6-9 0-3.6-1.2-6.1-3.6-6.4z" fill="#F3E3C3"/><path d="M16 9.5v15" stroke="#7A2635" stroke-width="1.4"/></svg>
    <div><b>Tramoya</b><small>Vídeos de procesos, sin esfuerzo</small></div>
  </div>
  <button class="nuevo" id="btn-nuevo">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    Nuevo vídeo
  </button>
  <div class="titulo-lista">Tus vídeos</div>
  <div class="buscar oculto" id="buscar"><input type="text" id="filtro" placeholder="Buscar un vídeo…" aria-label="Buscar un vídeo"></div>
  <div id="lista"></div>
  <div class="pie-lateral">
    <button class="enlace oculto" id="btn-acceso">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 14h5M8 11.5V14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      Poner Tramoya en el escritorio
    </button>
    <button class="enlace" id="btn-carpeta">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4.5a1 1 0 0 1 1-1h3.6l1.5 1.6h5.9a1 1 0 0 1 1 1v6.4a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      Abrir la carpeta «Mis vídeos»
    </button>
    <button class="enlace" id="btn-ajustes">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      Ajustes
    </button>
  </div>
</aside>

<main><div class="lienzo" id="vista"></div></main>
<div id="aviso-flotante" role="status" aria-live="polite"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = async (ruta, datos) => {
  const r = await fetch(ruta, datos === undefined ? {} : {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(datos)});
  return r.json();
};

const ICON = {
  clic: '<path d="M6 2.5v3M2.5 6h3M3.4 3.4l2 2M8 7l6 2.4-2.6 1 2.2 2.2-1.4 1.4-2.2-2.2-1 2.6z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>',
  escribir: '<rect x="1.5" y="4" width="13" height="8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 6.5v3M7 6.5h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
  tecla: '<rect x="2" y="3" width="12" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5 9.5h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
  elegir: '<rect x="1.5" y="4" width="13" height="8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m9.5 7 1.5 1.6L12.5 7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
  ir: '<path d="M2.5 8h10M9 4.5 12.5 8 9 11.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>',
  info: '<circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 7.2v4M8 4.8v.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  bien: '<circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m5 8.2 2 2 4-4.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
  mal: '<path d="M8 2 14.5 13.5h-13z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 6.5v3M8 11.6v.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  bombilla: '<path d="M5.5 10.5c-1.3-.9-2-2.3-2-3.8a4.5 4.5 0 0 1 9 0c0 1.5-.7 2.9-2 3.8V12h-5zM6 14h4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>',
  ojo: '<path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/>',
  quitar: '<path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>',
  volver: '<path d="M3 8a5 5 0 1 0 1.5-3.6M3 2.5v2.3h2.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>',
  play: '<path d="M5 3.2v9.6L12.5 8z" fill="currentColor"/>',
  carpeta: '<path d="M1.5 4.5a1 1 0 0 1 1-1h3.6l1.5 1.6h5.9a1 1 0 0 1 1 1v6.4a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.4"/>',
  lapiz: '<path d="m10.5 2.5 3 3L6 13H3v-3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>',
  globo: '<circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1.5 8h13M8 1.5c2 2 2 11 0 13M8 1.5c-2 2-2 11 0 13" fill="none" stroke="currentColor" stroke-width="1.2"/>',
  texto: '<path d="M2.5 4h11M2.5 8h11M2.5 12h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
  altavoz: '<path d="M2.5 6h2.5L8.5 3v10L5 10H2.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.6a6 6 0 0 1 0 8.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
  copia: '<rect x="5" y="5" width="9" height="9" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5" fill="none" stroke="currentColor" stroke-width="1.4"/>',
  puntos: '<circle cx="3.5" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="12.5" cy="8" r="1.3" fill="currentColor"/>',
  subt: '<rect x="1.5" y="3" width="13" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4 8.5h3M8.5 8.5h3.5M4 10.8h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
  peli: '<rect x="1.5" y="3" width="13" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6.5 6v4l3.5-2z" fill="currentColor"/>',
};
const ico = (n, t = 16) => `<svg width="${t}" height="${t}" viewBox="0 0 16 16" aria-hidden="true">${ICON[n]}</svg>`;

let INICIO = {proyectos: [], voces: [], webs: [], ajustes: {}};
let P = null;              // proyecto abierto
let VISTA = "portada";     // portada | crear | grabar | explicar | video
let sondeo = null;
let guardarTimer = null;

async function cargarInicio() {
  INICIO = await api("/api/inicio");
  $("#btn-acceso").classList.toggle("oculto", !INICIO.windows || INICIO.acceso);
  $("#buscar").classList.toggle("oculto", INICIO.proyectos.length < 7);
  pintarLista();
}

let avisoTimer = null;
function avisar(texto) {
  const a = $("#aviso-flotante");
  a.textContent = texto; a.classList.add("ver");
  clearTimeout(avisoTimer); avisoTimer = setTimeout(() => a.classList.remove("ver"), 2600);
}

const nombreVoz = (v) => (v || "").split(" - ")[0].replace("Microsoft ", "").replace(" Desktop", "");

function pintarLista() {
  const l = $("#lista");
  if (!INICIO.proyectos.length) { l.innerHTML = '<div class="vacio-lista">Aún no hay ninguno.</div>'; return; }
  const f = ($("#filtro").value || "").trim().toLowerCase();
  const lista = INICIO.proyectos.filter((p) => !f || p.nombre.toLowerCase().includes(f));
  if (!lista.length) { l.innerHTML = '<div class="vacio-lista">Ninguno se llama así.</div>'; return; }
  l.innerHTML = lista.map((p) => {
    const vivo = ["abriendo", "preparado", "grabando", "haciendo"].includes(p.tarea);
    const estado = vivo ? "En marcha…" : p.video ? "Vídeo listo" : p.fase === "explicar" ? "Faltan las frases" : "Sin grabar";
    return `<button class="item ${P && P.id === p.id ? "activo" : ""}" data-id="${esc(p.id)}">
      <i class="punto ${vivo ? "vivo" : p.video ? "listo" : ""}"></i>
      <span>${esc(p.nombre)}<small>${estado}</small></span></button>`;
  }).join("");
  l.querySelectorAll(".item").forEach((b) => b.onclick = () => abrir(b.dataset.id));
}

async function abrir(id, vista) {
  P = await api(`/api/p/${id}`);
  VISTA = vista || (P.tarea.estado === "haciendo" || P.video ? "video" : P.pasos.length ? "explicar" : "grabar");
  if (["abriendo", "preparado", "grabando", "convirtiendo"].includes(P.tarea.estado)) VISTA = "grabar";
  pintar();
  pintarLista();
}

function guia() {
  const orden = ["grabar", "explicar", "video"];
  const nombres = {grabar: "Grabar", explicar: "Explicar", video: "Vídeo"};
  const actual = orden.indexOf(VISTA);
  const alcanzable = (v) => v === "grabar" || (v === "explicar" && P.pasos.length) || (v === "video" && P.pasos.length);
  return `<ol class="pasos-guia">${orden.map((v, i) => {
    const cls = i === actual ? "ahora" : alcanzable(v) && i < actual ? "hecho" : alcanzable(v) ? "hecho" : "";
    return `<li class="${cls}" data-v="${v}"><span class="n">${i < actual ? "✓" : i + 1}</span>${nombres[v]}</li>`;
  }).join("")}</ol>`;
}

function enlazarGuia() {
  document.querySelectorAll(".pasos-guia li.hecho").forEach((li) => li.onclick = () => { VISTA = li.dataset.v; pintar(); });
}

function pintar() {
  clearInterval(sondeo); sondeo = null;
  const v = $("#vista");
  v.classList.remove("vista"); void v.offsetWidth; v.classList.add("vista");
  ({portada, crear, grabar, explicar, video})[VISTA](v);
}

/* ---------- portada ---------- */
function portada(v) {
  v.innerHTML = `<div class="portada">
    <svg width="64" height="64" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#7A2635"/><path d="M7 7h18v2.6c-2.4.3-3.6 2.8-3.6 6.4 0 3.4 1.2 7.2 3.6 9H7c2.4-1.8 3.6-5.6 3.6-9 0-3.6-1.2-6.1-3.6-6.4z" fill="#F3E3C3"/><path d="M16 9.5v15" stroke="#7A2635" stroke-width="1.4"/></svg>
    <h1>Haz un vídeo de cualquier proceso</h1>
    <p class="sub">Haces el proceso una vez, escribes lo que quieres contar y Tramoya lo graba limpio: sin esperas, sin tropiezos y con el cursor señalando cada paso.</p>
    <button class="btn principal grande" id="empezar">Empezar un vídeo</button>
    <div class="tres">
      <div class="tarjeta"><div class="icono-redondo">${ico("clic", 18)}</div><b>1. Lo haces una vez</b><p>Se abre la web y haces el proceso como siempre. Tramoya apunta cada clic.</p></div>
      <div class="tarjeta"><div class="icono-redondo oro">${ico("texto", 18)}</div><b>2. Escribes qué decir</b><p>En los pasos que quieras, una frase. Sale en pantalla y, si quieres, la lee una voz.</p></div>
      <div class="tarjeta"><div class="icono-redondo verde">${ico("peli", 18)}</div><b>3. Sale el vídeo</b><p>Tramoya repite el proceso solo y graba el vídeo. ¿Cambias una frase? Se rehace en un momento.</p></div>
    </div></div>`;
  $("#empezar").onclick = () => { VISTA = "crear"; P = null; pintar(); pintarLista(); };
}

/* ---------- crear ---------- */
function crear(v) {
  v.innerHTML = `<h1>Nuevo vídeo</h1>
    <p class="sub">Dos datos y empezamos.</p>
    <div class="tarjeta">
      <label class="campo"><span>¿Cómo se llama el vídeo?</span>
        <input type="text" id="nombre" placeholder="Por ejemplo: Cómo pedir vacaciones" maxlength="80"></label>
      <div class="campo"><span>¿En qué web se hace?</span>
        ${(INICIO.webs || []).length ? `<div class="webs">${INICIO.webs.map((w, i) => `<button class="web ${i === 0 ? "on" : ""}" data-url="${esc(w.url)}" title="${esc(w.url)}">${ico("globo", 14)} ${esc(w.nombre)}</button>`).join("")}
          <button class="web" data-url="">${ico("lapiz", 14)} Otra web…</button></div>` : ""}
        <input type="text" id="url" class="${(INICIO.webs || []).length ? "oculto" : ""}" placeholder="Pega aquí la dirección de la web (https://…)" spellcheck="false">
        <small>Sirve cualquier web que se abra en el navegador: la intranet de tu empresa, un portal, una tienda, tu correo web… Copia la dirección de la barra del navegador y pégala aquí.</small>
        <small id="url-error" class="oculto" style="color:var(--rojo)">Esto no parece una dirección web. Debe ser algo como https://www.ejemplo.com</small></div>
      <div class="botones"><button class="btn principal grande" id="crear">Crear y pasar a grabar</button>
        <button class="btn discreto" id="anular">Cancelar</button></div>
    </div>`;
  const nombre = $("#nombre");
  nombre.focus();
  let url = (INICIO.webs && INICIO.webs[0] && INICIO.webs[0].url) || "";
  v.querySelectorAll(".web").forEach((b) => b.onclick = () => {
    v.querySelectorAll(".web").forEach((x) => x.classList.toggle("on", x === b));
    const campo = $("#url");
    campo.classList.toggle("oculto", !!b.dataset.url);
    url = b.dataset.url;
    if (!url) campo.focus();
  });
  const ir = async () => {
    if (!nombre.value.trim()) { nombre.focus(); nombre.placeholder = "Ponle un nombre, por ejemplo «Cómo pedir vacaciones»"; return; }
    let elegida = url || $("#url").value.trim();
    if (elegida && !/^https?:\/\//i.test(elegida)) elegida = "https://" + elegida;
    let valida = false;
    try { valida = !!new URL(elegida).hostname.includes("."); } catch { valida = false; }
    if (!valida && !/^https?:\/\/(localhost|\d+\.\d+\.\d+\.\d+)/i.test(elegida)) {
      $("#url").classList.remove("oculto"); $("#url-error").classList.remove("oculto"); $("#url").focus(); return;
    }
    const r = await api("/api/crear", {nombre: nombre.value, url: elegida});
    await cargarInicio();
    abrir(r.id, "grabar");
  };
  $("#crear").onclick = ir;
  nombre.onkeydown = (e) => { if (e.key === "Enter") ir(); };
  $("#url").onkeydown = (e) => { $("#url-error").classList.add("oculto"); if (e.key === "Enter") ir(); };
  $("#anular").onclick = () => { VISTA = "portada"; pintar(); };
}

/* ---------- grabar ---------- */
function cabecera(titulo, sub) {
  return `${guia()}<div class="titular"><h1 id="titulo">${titulo}</h1>
    <div class="menu"><button class="icono-btn" id="btn-menu" aria-label="Más opciones" title="Más opciones">${ico("puntos", 18)}</button></div></div>
    <p class="sub">${sub}</p>`;
}

function enlazarCabecera() {
  const b = $("#btn-menu"); if (!b) return;
  b.onclick = (e) => {
    e.stopPropagation();
    const viejo = $(".menu-lista"); if (viejo) { viejo.remove(); return; }
    const m = document.createElement("div");
    m.className = "menu-lista";
    m.innerHTML = `<button data-m="renombrar">${ico("lapiz")} Cambiar el nombre</button>
      <button data-m="duplicar">${ico("copia")} Duplicar (para hacer otra versión)</button>
      <button data-m="borrar" class="peligro">${ico("quitar")} Borrar</button>`;
    b.parentElement.append(m);
    m.onclick = async (ev) => {
      const o = ev.target.closest("button"); if (!o) return;
      m.remove();
      if (o.dataset.m === "renombrar") renombrar();
      if (o.dataset.m === "duplicar") {
        const r = await api(`/api/p/${P.id}/duplicar`, {});
        await cargarInicio(); await abrir(r.id); avisar("Copia creada. Ahora estás en la copia.");
      }
      if (o.dataset.m === "borrar") confirmar("¿Borrar este vídeo?", "Se borran sus pasos y frases. El vídeo que ya esté en «Mis vídeos» no se toca.", "Borrar", async () => {
        await api(`/api/p/${P.id}/borrar`, {}); P = null; VISTA = "portada"; await cargarInicio(); pintar(); avisar("Borrado.");
      });
    };
  };
}
document.addEventListener("click", () => { const m = $(".menu-lista"); if (m) m.remove(); });

function renombrar() {
  const h = $("#titulo");
  h.innerHTML = `<input type="text" maxlength="80" value="${esc(P.nombre)}" aria-label="Nombre del vídeo">`;
  const i = $("input", h); i.focus(); i.select();
  const fin = async (guardarlo) => {
    const n = i.value.trim();
    if (guardarlo && n && n !== P.nombre) {
      await api(`/api/p/${P.id}/guardar`, {nombre: n}); P.nombre = n; await cargarInicio(); avisar("Nombre cambiado.");
    }
    pintar();
  };
  i.onkeydown = (e) => { if (e.key === "Enter") fin(true); if (e.key === "Escape") fin(false); };
  i.onblur = () => fin(true);
}

function grabar(v) {
  const t = P.tarea || {estado: "quieto"};
  const web = esc(nombreWeb(P.url));
  let cuerpo;
  if (t.estado === "abriendo") {
    cuerpo = `<div class="tarjeta"><div class="en-vivo"><div class="girando"></div><h2 style="margin:0">Abriendo ${web}…</h2></div>
      <p class="pista" style="margin:0">La primera vez tarda unos segundos.</p></div>`;
  } else if (t.estado === "preparado") {
    cuerpo = `<div class="tarjeta">
      <div class="en-vivo"><div class="icono-redondo oro">${ico("globo", 20)}</div><div><h2 style="margin:0">La web ya está abierta</h2>
        <span class="pista">Todavía no se está grabando nada.</span></div></div>
      <ol class="lista-num">
        <li><span>Si te pide usuario y contraseña, <b>entra como siempre</b>. Eso no se graba y la próxima vez ya estarás dentro.</span></li>
        <li><span>Ve a la pantalla donde <b>empieza</b> el proceso.</span></li>
        <li><span>Vuelve aquí y pulsa <b>Empezar a grabar</b>.</span></li>
      </ol>
      <div class="botones"><button class="btn principal grande" id="empezar"><span class="punto-rojo"></span> Empezar a grabar</button>
        <button class="btn discreto" id="cancelar">Cancelar</button></div></div>`;
  } else if (t.estado === "grabando") {
    cuerpo = `<div class="tarjeta">
      <div class="en-vivo"><div class="anillo"></div><div><h2 style="margin:0">Grabando</h2>
        <span class="pista">Haz el proceso en la ventana de la web.</span></div>
        <div class="derecha marcador"><b>${t.n || 0}</b><small>${(t.n || 0) === 1 ? "paso" : "pasos"}</small></div></div>
      ${t.ultimo ? `<div class="ultimo">${ico("bien")}<span>${esc(t.ultimo)}</span></div>` : `<div class="ultimo espera">${ico("clic")}<span>Esperando tu primer clic…</span></div>`}
      <div class="consejos">
        <div class="consejo">${ico("bombilla")}<span>Hazlo con calma, como si se lo enseñaras a alguien. Si te equivocas, sigue: luego podrás quitar los pasos que sobren.</span></div>
        <div class="consejo">${ico("ojo")}<span>Los botones que guardan (Imputar, Guardar, Enviar…) púlsalos con normalidad: al hacer el vídeo, el último se señala sin pulsarlo, para que no se guarde dos veces.</span></div>
      </div>
      <div class="botones"><button class="btn principal grande" id="terminar">Ya he terminado</button>
        <span class="pista">o cierra la ventana de la web</span></div></div>`;
  } else if (t.estado === "convirtiendo") {
    cuerpo = `<div class="tarjeta"><div class="en-vivo"><div class="girando"></div><h2 style="margin:0">Ordenando los pasos…</h2></div></div>`;
  } else {
    const error = t.estado === "error" ? `<div class="aviso mal">${ico("mal")}<p>${esc(t.msg)}</p></div>` : "";
    const ya = P.pasos.length ? `<div class="aviso info">${ico("info")}<p>Este vídeo ya tiene ${P.pasos.length} pasos grabados. Si grabas otra vez, se sustituyen (las frases de los pasos que se repitan se conservan).</p></div>` : "";
    cuerpo = `${error}${ya}<div class="tarjeta">
      <h2>Así se graba</h2>
      <ol class="lista-num">
        <li><span>Pulsa <b>Abrir la web</b>: se abre <b>${web}</b> en una ventana.</span></li>
        <li><span>Entras si hace falta y vas a donde empieza el proceso.</span></li>
        <li><span>Pulsas <b>Empezar a grabar</b> y haces el proceso una vez.</span></li>
        <li><span>Pulsas <b>Ya he terminado</b>. Listo.</span></li>
      </ol>
      <div class="botones"><button class="btn principal grande" id="abrir-web">${ico("globo")} Abrir la web</button>
        ${P.pasos.length ? '<button class="btn discreto derecha" id="saltar">Ir a las frases sin regrabar</button>' : ""}</div>
      <p class="pista" style="margin:16px 0 0">Web: ${esc(P.url)} · <a href="#" id="cambiar-web">cambiar</a></p></div>`;
  }
  v.innerHTML = cabecera(esc(P.nombre), "Paso 1 de 3: haz el proceso una vez y Tramoya apunta lo que haces.") + cuerpo;
  enlazarGuia();
  enlazarCabecera();
  const on = (id, fn) => { const b = $("#" + id); if (b) b.onclick = fn; };
  on("abrir-web", async () => { await api(`/api/p/${P.id}/abrir-web`, {}); refrescar(); });
  on("empezar", async () => { await api(`/api/p/${P.id}/empezar`, {}); });
  on("terminar", async () => { await api(`/api/p/${P.id}/terminar`, {}); P.tarea = {estado: "convirtiendo"}; pintar(); });
  on("cancelar", async () => { await api(`/api/p/${P.id}/cancelar`, {}); refrescar(); });
  on("saltar", () => { VISTA = "explicar"; pintar(); });
  on("cambiar-web", (e) => { e.preventDefault(); pedirWeb(); });
  on("borrar", () => confirmar("¿Borrar este vídeo?", "Se borran sus pasos y frases. El vídeo que ya esté en «Mis vídeos» no se toca.", "Borrar", async () => {
    await api(`/api/p/${P.id}/borrar`, {}); P = null; VISTA = "portada"; await cargarInicio(); pintar();
  }));
  if (["abriendo", "preparado", "grabando", "convirtiendo"].includes(t.estado)) vigilar();
}

function pedirWeb() {
  const d = document.createElement("div");
  d.className = "dialogo-fondo";
  d.innerHTML = `<div class="dialogo" role="dialog" aria-modal="true"><h2>¿En qué web se hace?</h2>
    <p>Pega la dirección de la página donde empieza el proceso.</p>
    <input type="text" id="d-url" value="${esc(P.url)}">
    <div class="botones" style="margin-top:18px"><button class="btn principal" id="d-si">Guardar</button><button class="btn discreto" id="d-no">Cancelar</button></div></div>`;
  document.body.append(d);
  const i = $("#d-url", d); i.focus(); i.select();
  $("#d-no", d).onclick = () => d.remove();
  $("#d-si", d).onclick = async () => {
    let url = i.value.trim(); if (!url) return;
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    await api(`/api/p/${P.id}/guardar`, {url}); d.remove(); P.url = url; pintar();
  };
}

function nombreWeb(url) {
  const w = (INICIO.webs || []).find((x) => x.url === url);
  if (w) return w.nombre;
  try { return new URL(url).hostname; } catch { return "la web"; }
}

async function refrescar() {
  const antes = P.tarea?.estado;
  P = await api(`/api/p/${P.id}`);
  if (VISTA === "grabar" && antes !== "quieto" && P.tarea.estado === "quieto" && P.fase === "explicar") VISTA = "explicar";
  if (VISTA === "video" && P.tarea.estado === "error" && P.tarea.paso) { /* se queda para enseñar el error */ }
  pintar();
  cargarInicio();
}

function vigilar() {
  let ultimo = JSON.stringify(P.tarea);
  sondeo = setInterval(async () => {
    const q = await api(`/api/p/${P.id}`);
    const ahora = JSON.stringify(q.tarea);
    if (ahora !== ultimo) {
      ultimo = ahora;
      if (VISTA === "video" && q.tarea.estado === "haciendo") {
        P = q; actualizarProgreso(); return;
      }
      if (VISTA === "grabar" && q.tarea.estado === "grabando" && P.tarea.estado === "grabando" && $(".marcador")) {
        P = q;
        $(".marcador b").textContent = q.tarea.n || 0;
        $(".marcador small").textContent = (q.tarea.n || 0) === 1 ? "paso" : "pasos";
        const u = $(".ultimo");
        u.classList.remove("espera", "nuevo"); void u.offsetWidth; u.classList.add("nuevo");
        u.innerHTML = `${ico("bien")}<span>${esc(q.tarea.ultimo || "")}</span>`;
        return;
      }
      const antes = P.tarea.estado;
      P = q;
      if (VISTA === "grabar" && q.tarea.estado === "quieto" && q.fase === "explicar" && antes !== "quieto") VISTA = "explicar";
      pintar(); cargarInicio();
    }
  }, 900);
}

/* ---------- explicar ---------- */
function explicar(v) {
  const pasos = P.pasos;
  const fallo = P.tarea?.estado === "error" ? P.tarea.paso : null;
  const avisos = (P.avisos || []).map((a) => `<p>${esc(a)}</p>`).join("");
  v.innerHTML = cabecera("Escribe qué quieres contar",
      "Paso 2 de 3: en los pasos que quieras, escribe una frase. Saldrá en pantalla en ese momento y, si activas la voz, se leerá en alto. Los pasos sin frase se hacen sin más.")
    + (avisos ? `<div class="aviso info">${ico("info")}<div>${avisos}</div></div>` : "")
    + `<div class="cabecera-pasos"><h2 style="margin:0">Lo que has hecho</h2><span class="contador derecha" id="contador"></span></div>
    <div id="pasos">${pasos.map(pasoHTML).join("")}</div>
    <div class="barra-fija">
      <button class="btn discreto" id="regrabar">${ico("volver")} Volver a grabar</button>
      <button class="btn principal grande derecha" id="seguir">Siguiente: hacer el vídeo</button>
    </div>`;
  enlazarGuia();
  enlazarCabecera();
  const caja = $("#pasos");
  caja.querySelectorAll("textarea").forEach((ta) => { crecer(ta); ta.oninput = () => { crecer(ta); cambiar(ta.closest(".paso"), "texto", ta.value); }; });
  caja.oninput = (e) => { if (e.target.matches("[data-valor]")) cambiarValor(e.target); };
  caja.onclick = (e) => {
    const b = e.target.closest("button[data-a]"); if (!b) return;
    const el = b.closest(".paso"), p = pasoDe(el);
    if (b.dataset.a === "seguro") cambiar(el, "seguro", !p.seguro, true);
    if (b.dataset.a === "quitar") cambiar(el, "quitado", !p.quitado, true);
    if (b.dataset.a === "oir") { api("/api/oir", {texto: p.texto}); return; }
    if (b.dataset.a === "usar") { const ta = $("textarea", el); ta.value = sugerencia(p); crecer(ta); cambiar(el, "texto", ta.value); ta.focus(); }
  };
  contar();
  $("#regrabar").onclick = () => { VISTA = "grabar"; P.tarea = {estado: "quieto"}; pintar(); };
  $("#seguir").onclick = async () => { await guardarYa(); VISTA = "video"; P.tarea = {estado: "quieto"}; pintar(); };
  if (fallo) { const el = caja.querySelector(`[data-id="${fallo}"]`); if (el) el.scrollIntoView({block: "center"}); }
  else { const primera = caja.querySelector("textarea"); if (primera && !pasos.some((p) => p.texto)) primera.focus(); }
}

function pasoHTML(p) {
  if (p.tipo === "tecla") {
    return `<div class="paso tecla ${p.quitado ? "quitado" : ""}" data-id="${p.id}">
      <div class="num">${p.id}</div>
      <div class="que"><span style="color:var(--suave)">${ico("tecla")}</span><b>${esc(p.desc)}</b>
        <button class="chip" data-a="quitar">${p.quitado ? ico("volver", 13) + " Recuperar" : ico("quitar", 13) + " Quitar"}</button></div></div>`;
  }
  const fallo = P.tarea?.estado === "error" && P.tarea.paso === p.id;
  const seguro = p.tipo === "clic" ? `<button class="chip ${p.seguro ? "on" : ""}" data-a="seguro" title="El cursor va hasta el botón pero no lo pulsa, así el vídeo no guarda nada">
      <span class="marca-check">${p.seguro ? '<svg width="9" height="9" viewBox="0 0 10 10"><path d="m2 5 2 2 4-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>' : ""}</span>
      Solo señalar, sin pulsar</button>` : "";
  return `<div class="paso ${p.texto ? "con-texto" : ""} ${p.quitado ? "quitado" : ""} ${fallo ? "fallo" : ""}" data-id="${p.id}">
    <div class="num">${p.id}</div>
    <div class="que"><span style="color:var(--suave)">${ico(p.tipo)}</span><b>${esc(p.desc)}</b></div>
    <div>
      ${fallo ? `<div class="aviso mal" style="margin:6px 0 10px">${ico("mal")}<p>${esc(P.tarea.msg)} Puedes marcarlo como «Solo señalar», quitarlo o volver a grabar.</p></div>` : ""}
      ${p.tipo === "escribir" && !p.quitado ? `<label class="valor">Se escribe:<input type="text" data-valor value="${esc(p.valor)}" spellcheck="false"></label>` : ""}
      <textarea rows="1" maxlength="260" placeholder="Qué quieres que ponga aquí (opcional)" ${p.quitado ? "disabled" : ""}>${esc(p.texto || "")}</textarea>
      <div class="acciones">
        ${p.quitado ? "" : seguro}
        ${p.quitado || p.texto ? "" : `<button class="chip" data-a="usar" title="${esc(sugerencia(p))}">${ico("lapiz", 13)} Escribir lo que se hace</button>`}
        ${!p.quitado && p.texto && INICIO.voces.length ? `<button class="chip" data-a="oir">${ico("altavoz", 13)} Escuchar</button>` : ""}
        <button class="chip derecha" data-a="quitar">${p.quitado ? ico("volver", 13) + " Recuperar" : ico("quitar", 13) + " Quitar este paso"}</button>
      </div>
    </div></div>`;
}

function sugerencia(p) {
  return p.desc.replace(/^Pulsa (el botón|el enlace|la pestaña) /, "Pulsa ").replace(/ en el campo «/, " en «");
}

const pasoDe = (el) => P.pasos.find((p) => p.id === Number(el.dataset.id));

function cambiar(el, clave, valor, repintar) {
  const p = pasoDe(el);
  p[clave] = valor;
  if (clave === "texto") {
    el.classList.toggle("con-texto", !!valor.trim());
    const tiene = !!$('[data-a="oir"]', el), quiere = !!valor.trim() && INICIO.voces.length > 0;
    if (tiene !== quiere) repintar = true;
  }
  if (repintar) {
    const nuevo = document.createElement("div");
    nuevo.innerHTML = pasoHTML(p);
    const n = nuevo.firstElementChild;
    el.replaceWith(n);
    n.querySelectorAll("textarea").forEach((ta) => {
      crecer(ta); ta.oninput = () => { crecer(ta); cambiar(n, "texto", ta.value); };
      if (clave === "texto") { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    });
  }
  contar();
  clearTimeout(guardarTimer);
  guardarTimer = setTimeout(guardarYa, 500);
}

async function guardarYa() {
  clearTimeout(guardarTimer);
  await api(`/api/p/${P.id}/guardar`, {pasos: P.pasos});
}

function contar() {
  const c = $("#contador"); if (!c) return;
  const vivos = P.pasos.filter((p) => !p.quitado);
  const con = vivos.filter((p) => (p.texto || "").trim()).length;
  c.textContent = `${vivos.length} pasos · ${con} con texto`;
}

function cambiarValor(input) {
  const el = input.closest(".paso"), p = pasoDe(el);
  if (p.valor_grabado === undefined) p.valor_grabado = p.valor;
  p.valor = input.value;
  // Los pasos de después que encuentran algo por ese texto (la fila de lo que se acaba
  // de escribir, por ejemplo) lo buscan ya con el valor nuevo.
  P.pasos.forEach((q, i) => {
    if (!q.selector) return;
    if (q.selector_grabado === undefined) q.selector_grabado = q.selector;
    let sel = q.selector_grabado;
    P.pasos.slice(0, i).forEach((r) => {
      if (r.valor_grabado && r.valor_grabado.length >= 2 && r.valor !== r.valor_grabado) sel = sel.split(r.valor_grabado).join(r.valor);
    });
    q.selector = sel;
  });
  p.desc = p.desc.replace(/^Escribe «.*?»/, `Escribe «${input.value}»`);
  $(".que b", el).textContent = p.desc;
  clearTimeout(guardarTimer);
  guardarTimer = setTimeout(guardarYa, 500);
}

function crecer(ta) { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + 2 + "px"; }

/* ---------- vídeo ---------- */
function video(v) {
  const t = P.tarea || {estado: "quieto"};
  const hayVoz = INICIO.voces.length > 0;
  const conTexto = P.pasos.filter((p) => !p.quitado && (p.texto || "").trim()).length;
  let cuerpo;
  if (t.estado === "haciendo") {
    cuerpo = `<div class="tarjeta">
      <div class="en-vivo"><div class="anillo"></div><div><h2 style="margin:0" id="msg">${esc(t.msg || "Empezando…")}</h2>
      <span class="pista">La web se mueve sola en otra ventana. No la toques ni la cierres.</span></div></div>
      <div class="progreso"><i id="barra" style="width:${Math.round((t.p || 0) * 100)}%"></i></div>
      <div class="fases" id="fases"></div>
      <div class="botones" style="margin-top:20px"><button class="btn discreto" id="cancelar">Cancelar</button></div></div>`;
  } else if (P.video && t.estado !== "error") {
    cuerpo = `${t.estado === "listo" ? `<div class="aviso bien">${ico("bien")}<p><b>¡Vídeo listo!</b> Está guardado en la carpeta «Mis vídeos».</p></div>` : ""}
      <div class="tarjeta">
      <video controls src="/video/${esc(P.id)}.mp4?${Date.now()}"></video>
      <div class="botones">
        <button class="btn principal" id="ver">${ico("play")} Abrir el vídeo</button>
        <button class="btn" id="carpeta">${ico("carpeta")} Mostrar en la carpeta</button>
        <button class="btn discreto derecha" id="cambiar">${ico("lapiz")} Cambiar textos y rehacer</button>
      </div>
      ${P.hecho ? `<p class="pista" style="margin:14px 0 0">Hecho el ${esc(P.hecho)}${P.voz ? ", con voz" : ""}.${P.srt ? " Junto al vídeo están también sus subtítulos (.srt), por si los quieres subir a Teams, Stream o YouTube." : ""}</p>` : ""}</div>`;
  } else {
    const error = t.estado === "error" ? `<div class="aviso mal">${ico("mal")}<div><p>${esc(t.msg)}</p>
      ${t.paso ? '<p><button class="btn" id="ir-paso" style="margin-top:8px">Ir a ese paso</button></p>' : ""}</div></div>` : "";
    cuerpo = `${error}<div class="tarjeta">
      ${conTexto ? "" : `<div class="aviso info">${ico("info")}<p>No has escrito ningún texto: el vídeo saldrá solo con el cursor. Puedes <a href="#" id="a-textos">añadir algunos</a>.</p></div>`}
      <div class="opcion">
        <div><b>Con voz</b><small>${hayVoz ? `Lee las frases en alto con la voz de Windows (${esc(nombreVoz(INICIO.ajustes.voz || INICIO.voces[0]))}). Puedes cambiarla en <a href="#" id="a-ajustes">Ajustes</a>.` : "Este ordenador no tiene voces instaladas; las frases saldrán solo en pantalla."}</small></div>
        <label class="interruptor"><input type="checkbox" id="voz" ${hayVoz && P.voz !== false ? "checked" : ""} ${hayVoz ? "" : "disabled"} aria-label="Con voz"><span></span></label>
      </div>
      <ol class="lista-num">
        <li><span>Tramoya abre la web y repite tus pasos sola, con calma y sin errores.</span></li>
        <li><span>Mientras tanto, <b>no toques esa ventana</b>. Tarda más o menos lo que dura el vídeo.</span></li>
        <li><span>Al terminar, el vídeo aparece aquí y en la carpeta «Mis vídeos».</span></li>
      </ol>
      <div class="botones"><button class="btn principal grande" id="hacer">${ico("peli", 18)} Hacer el vídeo</button>
        <button class="btn discreto" id="atras">Volver a los textos</button></div></div>`;
  }
  v.innerHTML = cabecera(esc(P.nombre), "Paso 3 de 3: Tramoya repite el proceso y graba el vídeo.") + cuerpo;
  enlazarGuia();
  enlazarCabecera();
  const on = (id, fn) => { const b = $("#" + id); if (b) b.onclick = fn; };
  on("hacer", async () => { await api(`/api/p/${P.id}/video`, {voz: $("#voz").checked}); refrescar(); });
  on("cancelar", async () => { await api(`/api/p/${P.id}/cancelar`, {}); refrescar(); });
  on("ver", () => api(`/api/p/${P.id}/abrir`, {que: "video"}));
  on("carpeta", () => api(`/api/p/${P.id}/abrir`, {que: "carpeta"}));
  on("cambiar", () => { VISTA = "explicar"; P.tarea = {estado: "quieto"}; pintar(); });
  on("atras", () => { VISTA = "explicar"; pintar(); });
  on("ir-paso", () => { VISTA = "explicar"; pintar(); });
  on("a-textos", (e) => { e.preventDefault(); VISTA = "explicar"; pintar(); });
  on("a-ajustes", (e) => { e.preventDefault(); ajustes(); });
  if (t.estado === "haciendo") { actualizarProgreso(); vigilar(); }
}

function actualizarProgreso() {
  const t = P.tarea, b = $("#barra"); if (!b) return pintar();
  b.style.width = Math.round((t.p || 0) * 100) + "%";
  $("#msg").textContent = t.msg || "";
  const fases = [["voz", "Voz", P.voz], ["grabar", "Grabación", true], ["montar", "Montaje", true]].filter((f) => f[2]);
  const actual = t.p >= .8 ? "montar" : t.p >= .15 ? "grabar" : "voz";
  const idx = fases.findIndex((f) => f[0] === actual);
  $("#fases").innerHTML = fases.map((f, i) => `<span class="${i < idx ? "ya" : i === idx ? "ahora" : ""}">${i < idx ? "✓ " : ""}${f[1]}</span>`).join("");
}

/* ---------- ajustes ---------- */
function ajustes() {
  const a = {...INICIO.ajustes};
  const d = document.createElement("div");
  d.className = "dialogo-fondo";
  const seg = (clave, opciones) => `<div class="segmentos" data-clave="${clave}">${opciones.map(([v, t]) =>
    `<button data-v="${v}" class="${a[clave] === v ? "on" : ""}">${t}</button>`).join("")}</div>`;
  d.innerHTML = `<div class="dialogo ancho" role="dialog" aria-modal="true" aria-label="Ajustes"><h2>Ajustes</h2>
    <p style="margin-bottom:8px">Valen para todos los vídeos nuevos.</p>
    ${INICIO.voces.length ? `<div class="ajuste"><b>Voz</b><small>La voz que lee las frases. Son las voces de Windows de este ordenador.</small>
      <select id="a-voz">${INICIO.voces.map((v) => `<option value="${esc(v)}" ${v === (a.voz || INICIO.voces[0]) ? "selected" : ""}>${esc(nombreVoz(v))} · ${esc((v.split(" - ")[1] || "").trim())}</option>`).join("")}</select>
      <div style="margin-top:14px"><b style="font-weight:500">Velocidad de la voz</b>
        <input type="range" id="a-vel" min="-5" max="5" step="1" value="${a.velocidad || 0}" aria-label="Velocidad de la voz">
        <div class="escala"><span>Más despacio</span><span>Normal</span><span>Más deprisa</span></div></div>
      <button class="btn" id="a-probar" style="margin-top:10px">${ico("altavoz")} Probar la voz</button></div>` : ""}
    <div class="ajuste"><b>Ritmo del vídeo</b><small>Cuánto se para entre un paso y el siguiente.</small>
      ${seg("ritmo", [["tranquilo", "Tranquilo"], ["normal", "Normal"], ["agil", "Ágil"]])}</div>
    <div class="ajuste"><b>Tamaño del vídeo</b><small>Si vas a verlo a pantalla completa, mejor Full HD. Se aplica a lo que grabes a partir de ahora.</small>
      ${seg("tamano", [["720p", "HD (1280×720)"], ["800p", "Portátil (1280×800)"], ["1080p", "Full HD (1920×1080)"]])}</div>
    <div class="ajuste"><div class="opcion" style="margin:0"><div><b>Guardar también los subtítulos</b><small>Un archivo .srt junto al vídeo, para Teams, Stream o YouTube.</small></div>
      <label class="interruptor"><input type="checkbox" id="a-srt" ${a.srt ? "checked" : ""} aria-label="Guardar subtítulos"><span></span></label></div></div>
    <div class="ajuste"><details><summary>Avanzado</summary>
      <small style="display:block;color:var(--suave);margin:8px 0">Si una web de tu empresa te pide la contraseña de Windows cada vez, escribe aquí su dominio (por ejemplo <code>*.miempresa.com</code>) para que entre sola. La web de cada vídeo ya se incluye.</small>
      <input type="text" id="a-dom" value="${esc((a.dominios || []).join(", "))}" placeholder="*.miempresa.com, *.miempresa.net" spellcheck="false"></details></div>
    <div class="botones" style="margin-top:8px"><button class="btn principal" id="a-ok">Guardar</button><button class="btn discreto" id="a-no">Cancelar</button></div></div>`;
  document.body.append(d);
  d.querySelectorAll(".segmentos").forEach((g) => g.onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    a[g.dataset.clave] = b.dataset.v;
    g.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
  });
  const leer = () => {
    if ($("#a-voz", d)) { a.voz = $("#a-voz", d).value; a.velocidad = Number($("#a-vel", d).value); }
    a.srt = $("#a-srt", d).checked; a.dominios = $("#a-dom", d).value;
  };
  const probar = $("#a-probar", d);
  if (probar) probar.onclick = async () => {
    leer();
    await api("/api/ajustes", {voz: a.voz, velocidad: a.velocidad});
    api("/api/oir", {texto: "Hola. Así sonará la voz de tus vídeos."});
  };
  const cerrar = () => { d.remove(); document.removeEventListener("keydown", tecla); };
  const tecla = (e) => { if (e.key === "Escape") cerrar(); };
  document.addEventListener("keydown", tecla);
  $("#a-no", d).onclick = cerrar;
  d.onclick = (e) => { if (e.target === d) cerrar(); };
  $("#a-ok", d).onclick = async () => {
    leer(); INICIO.ajustes = await api("/api/ajustes", a); cerrar(); avisar("Ajustes guardados."); if (P) pintar();
  };
}

/* ---------- diálogo ---------- */
function confirmar(titulo, texto, si, fn) {
  const d = document.createElement("div");
  d.className = "dialogo-fondo";
  d.innerHTML = `<div class="dialogo" role="dialog" aria-modal="true"><h2>${esc(titulo)}</h2><p>${esc(texto)}</p>
    <div class="botones"><button class="btn principal" id="d-si">${esc(si)}</button><button class="btn discreto" id="d-no">Cancelar</button></div></div>`;
  document.body.append(d);
  const cerrar = () => { d.remove(); document.removeEventListener("keydown", tecla); };
  const tecla = (e) => { if (e.key === "Escape") cerrar(); };
  document.addEventListener("keydown", tecla);
  $("#d-no", d).onclick = cerrar;
  d.onclick = (e) => { if (e.target === d) cerrar(); };
  $("#d-si", d).onclick = () => { cerrar(); fn(); };
  $("#d-si", d).focus();
}

$("#btn-ajustes").onclick = ajustes;
$("#filtro").oninput = pintarLista;
$("#btn-acceso").onclick = async () => {
  const r = await api("/api/acceso", {});
  if (r.error) return avisar(r.error);
  INICIO.acceso = true; $("#btn-acceso").classList.add("oculto"); avisar("Listo: tienes Tramoya en el escritorio.");
};
$("#btn-nuevo").onclick = () => { P = null; VISTA = "crear"; pintar(); pintarLista(); };
$("#btn-carpeta").onclick = () => P ? api(`/api/p/${P.id}/abrir`, {que: "carpeta"}) : fetch("/api/carpeta", {method: "POST"});

(async () => {
  await cargarInicio();
  if (INICIO.proyectos.length) abrir(INICIO.proyectos[0].id); else pintar();
})();
</script>
</body>
</html>
