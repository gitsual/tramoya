/* Los tokens, por capas como en la hoja del lienzo: primitivas (rampas de Solnítido en
   clave de teatro), y encima los semánticos, que son lo único que leen los componentes.
   Se diseña en oscuro («a oscuras», la sala): el amarillo foco es la luz, no la pared.
   «Sala iluminada» es el modo claro. */
:root {
  /* primitivas */
  --foco-400: #E9A80E; --foco-500: #B58203; --foco-600: #936906; --foco-300: #E8B456; --foco-100: #FAE5C3;
  --tablas-400: #A9A49B; --tablas-500: #908C83; --tablas-800: #33312D; --tablas-900: #211F1C;
  --cielo-300: #8DC6E9; --cielo-400: #519BC5; --cielo-600: #38799D;
  --sala-50: #E9F3FE; --sala-200: #B3CEEB; --sala-300: #93AECA; --sala-700: #1F4A70; --sala-800: #16334E; --sala-900: #0E2A47;
  --telon-600: #4F759A; --telon-500: #6491BB;
  --papel-0: #FFFFFF; --papel-50: #F5F4F1; --papel-100: #F2F0EC; --papel-200: #E6E4E0; --papel-300: #D6D4D0;
  --papel-500: #908C83; --papel-700: #595854; --papel-900: #201F1C;

  /* semánticos · a oscuras */
  --fondo: var(--sala-900);            /* background-std */
  --lateral: var(--sala-800);          /* background-sidebar */
  --barra: var(--papel-900);           /* background-navbar */
  --superficie: var(--sala-800);       /* una card: más clara = más elevada */
  --superficie-2: var(--sala-700);     /* fila seleccionada, hover */
  --hundido: var(--sala-900);          /* dentro de un campo */
  --texto: var(--sala-50);             /* content-strong */
  --suave: var(--sala-200);            /* content-secondary */
  --tenue: var(--sala-300);
  --inverso: var(--papel-900);
  --linea: #23496B;                    /* divisor */
  --control: var(--telon-500);         /* borde de un control, ≥ 3:1 */
  --foco: var(--foco-400);             /* la única acción primaria */
  --foco-hover: var(--foco-500);       /* el hover oscurece */
  --foco-texto: var(--foco-400);       /* números de cue */
  --secundario: var(--tablas-400);
  --secundario-hover: var(--tablas-500);
  --acento: var(--cielo-400);          /* las medidas: progreso, contadores */
  --acento-texto: var(--cielo-300);
  --anillo: var(--cielo-300);          /* foco de teclado, 2 px, separado 2 */
  --capa: #05121F99;                   /* overlay alpha-60 */
  --telon: var(--sala-800);            /* bambalina, festón y telones */
  --pliegues: repeating-linear-gradient(90deg, #16334E 0 20px, #0E2A47 20px 27px, #1F4A70 27px 30px, #16334E 30px 44px);
  --info-bg: #023F6F; --info-tx: #D7EAFE; --info: #5A9FDB;
  --bien-bg: #024B1F; --bien-tx: #D6F0DA; --bien: #3B9555;
  --cuidado-bg: #493C00; --cuidado-tx: #F0E8CA; --cuidado: #EDCC48;
  --mal-bg: #68231E; --mal-tx: #FEE0DC; --mal: #E0574F; --mal-texto: #FF9B91;   /* texto rojo sobre la sala: 4,5:1 */
  --rojo: var(--mal-texto);            /* el punto de «grabando» y los errores en línea */
  --sombra-2: 4px 4px 0 #05121F;       /* cartel clavado */
  --sombra-3: 8px 8px 0 #05121F;       /* colgado: menú, diálogo */

  --fuente: "Archivo", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace;
  --entra: cubic-bezier(.2, .7, .2, 1);    /* el telón sube frenando */
  --sale: cubic-bezier(.6, 0, .9, .4);     /* y cae con peso */
  --control-alto: 40px;
  --margen: 32px;
  color-scheme: dark;
}
:root[data-sala="iluminada"] {
  --fondo: var(--papel-50);
  --lateral: var(--papel-200);
  --superficie: var(--papel-0);
  --superficie-2: var(--papel-100);
  --hundido: var(--papel-0);
  --texto: var(--papel-900);
  --suave: var(--papel-700);
  --tenue: #6B6965;
  --inverso: var(--papel-50);
  --linea: var(--papel-300);
  --control: var(--papel-500);
  --foco-texto: #735100;               /* foco.700: el 600 se queda en 4,48 con letra pequeña */
  --acento-texto: #275E7C;             /* ciclorama.700: el 600 se queda en 4,35 */
  --anillo: #175D9B;
  --capa: #201F1C99;
  --telon: var(--sala-800);
  --info-bg: #D7EAFE; --info-tx: #023F6F; --info: #175D9B;
  --bien-bg: #D6F0DA; --bien-tx: #024B1F; --bien: #3B9555;
  --cuidado-bg: #F0E8CA; --cuidado-tx: #493C00; --cuidado: #B58203;
  --mal-bg: #FEE0DC; --mal-tx: #68231E; --mal: #BA2B28; --mal-texto: #BA2B28;
  --sombra-2: 4px 4px 0 var(--papel-900);
  --sombra-3: 8px 8px 0 var(--papel-900);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--fondo); color: var(--texto);
  font: 14px/20px var(--fuente); -webkit-font-smoothing: antialiased;
  display: grid; grid-template-columns: 288px minmax(0, 1fr); grid-template-rows: 64px minmax(0, 1fr) 32px; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--anillo); outline-offset: 2px; }
::selection { background: var(--foco-300); color: var(--papel-900); }
a { color: var(--acento-texto); text-underline-offset: 3px; }
.cartel { font-family: var(--fuente); font-stretch: 66%; font-weight: 850; text-transform: uppercase; letter-spacing: .01em; line-height: .95; }
.cue { font: 400 12px/16px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.oculto { display: none !important; }

/* ---------- la barra de tramoya (arriba) y la bambalina ---------- */
.barra-tramoya {
  grid-column: 1 / -1; position: relative; z-index: 100; background: var(--barra); color: var(--papel-50);
  display: flex; align-items: center; gap: 16px; padding: 0 20px;
}
.barra-tramoya::after {   /* la bambalina festoneada que cuelga sobre la sala */
  content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 12px; pointer-events: none;
  background: radial-gradient(circle at 50% 0, var(--barra) 69%, transparent 70%) 0 0 / 28px 12px repeat-x;
}
.marca { display: flex; align-items: flex-start; gap: 12px; height: 64px; }
.marca svg { flex: none; }
.marca b { font-family: var(--fuente); font-stretch: 66%; font-weight: 850; text-transform: uppercase; font-size: 36px; line-height: 64px; letter-spacing: .01em; }
.contexto { display: flex; flex-direction: column; justify-content: center; min-width: 0; padding-left: 16px; border-left: 1px solid var(--tablas-800); height: 36px; }
.contexto small { font: 400 10.5px/12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--papel-300); }
.contexto span { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barra-tramoya .derecha { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.boton-barra {
  min-width: 40px; height: 40px; border: 1px solid var(--tablas-800); background: none; color: var(--papel-50); border-radius: 0;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 10px;
  font: 400 12px var(--mono); letter-spacing: .08em; text-transform: uppercase;
  transition: background 100ms, border-color 100ms;
}
.boton-barra:hover { background: var(--tablas-800); border-color: var(--tablas-500); }
.boton-barra[aria-pressed="true"] svg { color: var(--foco-400); }
#btn-programa { display: none; }

/* ---------- el programa (lateral) ---------- */
aside {
  background: var(--lateral); display: flex; flex-direction: column; min-height: 0; padding-top: 12px;
}
.nuevo {   /* añadir: borde punteado; la acción primaria es la del escenario */
  margin: 16px 16px 20px; min-height: var(--control-alto); padding: 0 14px; border: 1px dashed var(--control); border-radius: 0;
  background: none; color: var(--texto); font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background 100ms, border-color 100ms;
}
.nuevo:hover { background: var(--superficie-2); border-color: var(--texto); }
.nuevo:active { transform: scale(.97); }
.titulo-lista { margin: 0 16px 8px; padding-bottom: 8px; border-bottom: 4px solid var(--texto); display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.titulo-lista b { font-stretch: 66%; font-weight: 850; text-transform: uppercase; font-size: 25px; line-height: 28px; letter-spacing: .01em; }
.titulo-lista small { font: 400 10.5px/12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--suave); }
#lista { flex: 1; overflow: auto; padding: 0 16px 12px; counter-reset: cartel; }
.item {
  width: 100%; min-height: 56px; text-align: left; border: 0; border-bottom: 1px solid var(--linea); background: none; border-radius: 0;
  padding: 8px 8px; display: flex; gap: 12px; align-items: center; counter-increment: cartel; position: relative;
  transition: background 100ms;
}
.item::before { content: counter(cartel, decimal-leading-zero); font-stretch: 66%; font-weight: 850; font-size: 25px; line-height: 1; color: var(--tenue); flex: none; width: 30px; font-variant-numeric: tabular-nums; }
.item:hover { background: var(--superficie-2); }
.item.activo { background: var(--superficie-2); box-shadow: inset 4px 0 0 var(--foco); }
.item.activo::before { color: var(--foco-texto); }
.item span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.item small { display: flex; align-items: center; gap: 6px; color: var(--suave); font: 400 10.5px/14px var(--mono); letter-spacing: .08em; text-transform: uppercase; margin-top: 2px; }
/* el estado se lee también por la forma: rombo listo, triángulo pendiente, círculo en vivo, aro sin grabar */
.item .punto { width: 10px; height: 10px; flex: none; border: 1.5px solid var(--tenue); border-radius: 50%; }
.item .punto.listo { border: 0; background: var(--bien); border-radius: 0; transform: rotate(45deg) scale(.85); }
.item .punto.falta { border: 0; background: var(--cuidado); border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.item .punto.vivo { border: 0; background: var(--rojo); animation: latido 1.2s infinite; }
.vacio-lista { padding: 12px 8px; color: var(--suave); }
.vacio-lista b { display: block; color: var(--texto); margin-bottom: 4px; }
.en-vivo-lateral {   /* recording-status: lo que está en marcha, al pie del programa */
  margin: 0 16px 12px; padding: 8px 12px; background: var(--barra); color: var(--papel-50);
  display: flex; flex-direction: column; gap: 4px;
}
.en-vivo-lateral b { display: inline-flex; align-items: center; gap: 8px; font: 600 12px/16px var(--fuente); letter-spacing: .06em; text-transform: uppercase; color: var(--foco-400); }
.en-vivo-lateral b::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--foco-400); animation: latido 1.2s infinite; }
.en-vivo-lateral span { font: 400 12px/16px var(--mono); color: var(--papel-300); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pie-lateral { border-top: 1px dashed var(--linea); padding: 8px 8px 12px; display: flex; flex-direction: column; }
.enlace {
  border: 0; background: none; color: var(--suave); min-height: 40px; padding: 0 8px; border-radius: 0;
  display: flex; gap: 12px; align-items: center; text-align: left;
  transition: background 100ms, color 100ms;
}
.enlace:hover { color: var(--texto); background: var(--superficie-2); }

/* ---------- la barra de estado (abajo) ---------- */
.estado {
  grid-column: 1 / -1; background: var(--barra); color: var(--papel-300);
  display: flex; align-items: center; gap: 24px; padding: 0 20px; overflow: hidden;
  font: 400 10.5px/12px var(--mono); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;
}
.estado b { font-weight: 400; color: var(--papel-50); }
.estado .derecha { margin-left: auto; display: flex; gap: 24px; overflow: hidden; }
.estado span { overflow: hidden; text-overflow: ellipsis; }

/* ---------- el escenario (principal) ---------- */
main { overflow: auto; min-height: 0; scroll-padding-top: 24px; }   /* lo que se trae a la vista no queda bajo la bambalina */
.lienzo { max-width: 1040px; margin: 0 auto; padding: 32px var(--margen) 120px; }
h1 { font-family: var(--fuente); font-stretch: 66%; font-weight: 850; text-transform: uppercase; font-size: clamp(33px, 4vw, 44px); line-height: 1; letter-spacing: .01em; margin: 0 0 8px; }
h2 { font-family: var(--fuente); font-stretch: 66%; font-weight: 850; text-transform: uppercase; font-size: 25px; line-height: 28px; letter-spacing: .01em; margin: 0 0 12px; }
.sub { color: var(--suave); margin: 0 0 24px; font-size: 16px; line-height: 24px; max-width: 62ch; }
.migas { display: flex; flex-wrap: wrap; gap: 4px 8px; margin: 0 0 8px; font: 400 12px/16px var(--mono); color: var(--suave); }
.migas a { color: var(--texto); }
.migas [aria-current] { color: var(--texto); }
.migas i { font-style: normal; color: var(--tenue); }

/* los actos: una franja de escenario con el foco sobre el acto en curso */
.pasos-guia {
  position: relative; margin: -32px calc(-1 * var(--margen)) 32px; padding: 0 78px; height: 112px; list-style: none; overflow: hidden;
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end;
  background:
    radial-gradient(circle at 50% 0, var(--sala-800) 69%, transparent 70%) 0 10px / 36px 20px repeat-x,
    linear-gradient(var(--sala-800), var(--sala-800)) 0 0 / 100% 10px no-repeat,
    var(--sala-900);
  border-bottom: 6px solid var(--papel-900);
}
.pasos-guia::before, .pasos-guia::after { content: ""; position: absolute; top: 0; bottom: 0; width: 60px; background: var(--pliegues); }
.pasos-guia::before { left: 0; clip-path: polygon(0 0, 100% 0, 100% 58%, 40% 100%, 0 100%); }
.pasos-guia::after { right: 0; clip-path: polygon(0 0, 100% 0, 100% 100%, 60% 100%, 0 58%); }
.pasos-guia li {
  position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  gap: 4px; padding-bottom: 20px; color: var(--telon-500); cursor: default;
}
.pasos-guia li > * { position: relative; }
.pasos-guia .n { font: 400 12px/16px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.pasos-guia b { font-stretch: 66%; font-weight: 850; text-transform: uppercase; font-size: 33px; line-height: 32px; letter-spacing: .01em; }
.pasos-guia li.hecho { color: var(--sala-200); cursor: pointer; }
.pasos-guia li.hecho:hover { color: #fff; }
.pasos-guia li.ahora { color: #fff; padding-bottom: 14px; }
.pasos-guia li.ahora .n { color: var(--foco-300); }
.pasos-guia li.ahora::before { content: ""; position: absolute; inset: 0; background: var(--foco-400); opacity: .22; clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%); }
.pasos-guia li.ahora::after { content: ""; position: relative; width: 54px; height: 4px; background: var(--foco-400); margin-top: 4px; }

.tarjeta {
  background: var(--superficie); border: 1px solid var(--linea); border-top: 4px solid var(--texto); border-radius: 0;
  padding: 24px;
}
.tarjeta + .tarjeta, .aviso + .tarjeta { margin-top: 32px; }

.campo { display: block; margin-bottom: 20px; }
.campo > span { display: block; font-weight: 600; margin-bottom: 8px; }
.campo > small { display: block; color: var(--suave); margin-top: 8px; font-size: 12px; line-height: 16px; }
input[type=text], input[type=password], textarea, select {
  width: 100%; min-height: var(--control-alto); font: inherit; font-size: 14px; color: var(--texto); background: var(--hundido);
  border: 1px solid var(--control); border-radius: 0; padding: 9px 12px;
  transition: border-color 100ms, box-shadow 100ms, background 100ms;
}
input[type=text]:hover, input[type=password]:hover, textarea:hover, select:hover { border-color: var(--texto); }
input[type=text]:focus, input[type=password]:focus, textarea:focus, select:focus { outline: none; border-color: var(--foco); box-shadow: 0 0 0 2px var(--foco); }
input:disabled, textarea:disabled { opacity: .55; cursor: not-allowed; }
textarea { resize: none; line-height: 1.45; overflow: hidden; }
::placeholder { color: var(--tenue); opacity: 1; }

.botones { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
/* botones: foco (primaria, una por vista) · tablas (secundaria) · acotación (terciaria, subrayada) */
.btn {
  min-height: var(--control-alto); border: 0; background: var(--secundario); color: var(--papel-900); border-radius: 0;
  padding: 0 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: background 100ms, transform 100ms, box-shadow 100ms;
}
.btn:hover { background: var(--secundario-hover); }
.btn:active { transform: scale(.97); }
.btn.principal { background: var(--foco); color: var(--papel-900); font-family: var(--fuente); font-stretch: 66%; font-weight: 850; text-transform: uppercase; letter-spacing: .02em; font-size: 19px; }
.btn.principal:hover { background: var(--foco-hover); }
.btn.grande { min-height: 48px; padding: 0 24px; font-size: 16px; }
.btn.principal.grande { font-size: 22px; }
.btn.discreto { background: none; color: var(--texto); padding: 0 4px; box-shadow: inset 0 -2px 0 var(--control); }
.btn.discreto:hover { background: none; box-shadow: inset 0 -2px 0 var(--texto); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.derecha { margin-left: auto; }

/* portada: telón arriba (el escenario es siempre de noche) */
.escena { position: relative; margin: -32px calc(-1 * var(--margen)) 0; height: 560px; background: var(--sala-900); overflow: hidden; color: #fff; }
.escena > i { position: absolute; display: block; }
.escena .cuerda { top: 0; width: 2px; background: var(--tablas-400); }
.escena .contrapeso { width: 16px; height: 26px; background: var(--papel-900); border: 2px solid var(--tablas-400); }
.escena .contrapeso.oro { background: var(--foco-400); }
.escena .cono { inset: 0 0 92px 0; background: var(--foco-400); opacity: .16; clip-path: polygon(46% 0, 54% 0, 80% 100%, 20% 100%); }
.escena .lampara { left: 50%; top: 0; width: 62px; height: 30px; transform: translateX(-50%); background: var(--papel-900); border-bottom: 8px solid var(--foco-400); }
.escena .telon { top: 0; bottom: 92px; width: 15%; background: var(--pliegues); }
.escena .telon.izq { left: 0; clip-path: polygon(0 0, 100% 0, 100% 58%, 38% 100%, 0 100%); }
.escena .telon.der { right: 0; clip-path: polygon(0 0, 100% 0, 100% 100%, 62% 100%, 0 58%); }
.escena .bambalina { left: 0; right: 0; top: 0; height: 24px; background: var(--sala-800); }
.escena .feston { left: 0; right: 0; top: 24px; height: 30px; background: radial-gradient(circle at 50% 0, var(--sala-800) 69%, transparent 70%) 0 0 / 52px 30px repeat-x; }
.escena .tablas { left: 0; right: 0; bottom: 0; height: 92px; border-top: 6px solid var(--papel-900); background: repeating-linear-gradient(90deg, var(--tablas-800) 0 138px, var(--papel-900) 138px 140px); }
.escena .luz { left: 50%; bottom: 40px; transform: translateX(-50%); width: 60%; height: 58px; border-radius: 50%; background: var(--foco-300); opacity: .45; }
.escena-texto { position: relative; z-index: 1; height: 468px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; padding: 64px 19% 0; }
.escena-texto .cue { color: var(--foco-300); }
.escena-texto h1 { font-size: clamp(44px, 6vw, 79px); line-height: .95; color: #fff; margin: 0; }
.escena-texto .sub { color: var(--sala-200); margin: 0 auto; }
.tres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin-top: 32px; border-top: 6px solid var(--texto); text-align: left; }
.tres .acto { padding: 20px 24px 4px 0; }
.tres .acto + .acto { padding-left: 24px; border-left: 1px solid var(--linea); }
.tres .cue { color: var(--foco-texto); }
.tres b { display: block; margin: 8px 0; font-stretch: 66%; font-weight: 850; text-transform: uppercase; font-size: 25px; line-height: 28px; letter-spacing: .01em; }
.tres p { margin: 0; color: var(--suave); }
.icono-redondo { width: 40px; height: 40px; flex: none; border-radius: 0; display: grid; place-items: center; background: var(--cuidado-bg); color: var(--cuidado-tx); }
.icono-redondo.verde { background: var(--bien-bg); color: var(--bien-tx); }

/* instrucciones numeradas, como cues */
.lista-num { list-style: none; padding: 0; margin: 4px 0 24px; counter-reset: n; }
.lista-num li { counter-increment: n; display: flex; gap: 16px; padding: 12px 0; border-top: 1px solid var(--linea); align-items: center; }
.lista-num li:last-child { border-bottom: 1px solid var(--linea); }
.lista-num li::before {
  content: counter(n, decimal-leading-zero); flex: none; width: 44px; font-variant-numeric: tabular-nums;
  font-stretch: 66%; font-weight: 850; font-size: 33px; line-height: 32px; color: var(--foco-texto);
}

/* grabando */
.en-vivo { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
.anillo { position: relative; width: 54px; height: 54px; flex: none; }
.anillo::before, .anillo::after { content: ""; position: absolute; inset: 0; border-radius: 50%; }
.anillo::before { background: var(--rojo); inset: 15px; }
.anillo::after { border: 2px solid var(--rojo); animation: onda 1.6s ease-out infinite; }
@keyframes onda { from { transform: scale(.45); opacity: .9; } to { transform: scale(1); opacity: 0; } }
@keyframes latido { 50% { opacity: .35; } }
.consejos { display: grid; gap: 8px; margin: 8px 0 24px; }
.consejo { display: flex; gap: 12px; padding: 12px 16px; background: var(--superficie-2); border-left: 4px solid var(--foco); }
.consejo svg { flex: none; color: var(--foco-texto); margin-top: 2px; }

.girando { width: 24px; height: 24px; border-radius: 50%; border: 3px solid var(--linea); border-top-color: var(--acento); animation: gira .8s linear infinite; flex: none; }
@keyframes gira { to { transform: rotate(360deg); } }

/* avisos: fondo del estado, filo de su color y su forma en el icono */
.aviso { display: flex; gap: 12px; padding: 12px 16px; margin-bottom: 16px; border-left: 4px solid; }
.aviso svg { flex: none; margin-top: 2px; }
.aviso.info { background: var(--info-bg); color: var(--info-tx); border-color: var(--info); }
.aviso.mal { background: var(--mal-bg); color: var(--mal-tx); border-color: var(--mal); }
.aviso.bien { background: var(--bien-bg); color: var(--bien-tx); border-color: var(--bien); }
.aviso a { color: inherit; }
.aviso p { margin: 0; }
.aviso p + p { margin-top: 4px; }

/* el guion: cada paso es un cue con su acotación */
.cabecera-pasos { display: flex; align-items: end; gap: 16px; padding-bottom: 8px; border-bottom: 6px solid var(--texto); }
.contador { color: var(--acento-texto); font: 400 12px/16px var(--mono); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; font-variant-numeric: tabular-nums; }
.paso {
  display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px 16px;
  background: var(--superficie); border: 0; border-bottom: 1px solid var(--linea); border-radius: 0;
  padding: 20px 16px 16px 8px; margin: 0; transition: background 200ms, box-shadow 200ms, opacity 200ms;
}
.paso:focus-within { background: var(--superficie-2); box-shadow: inset 4px 0 0 var(--foco); }
.paso.fallo { box-shadow: inset 0 0 0 2px var(--mal); }
.paso .num {
  font-stretch: 66%; font-weight: 850; font-size: 44px; line-height: 40px; color: var(--tenue);
  grid-row: span 2; text-align: right; font-variant-numeric: tabular-nums;
}
.paso.con-texto .num { color: var(--foco-texto); }
.paso .que { display: flex; align-items: center; gap: 12px; min-height: 32px; }
.paso .que > span { display: none; }
.paso .que b { font: italic 400 14px/20px var(--mono); color: var(--suave); flex: 1; overflow-wrap: anywhere; }
.paso .que b::before { content: "("; }
.paso .que b::after { content: ")"; }
.paso textarea { font-size: 19px; line-height: 28px; padding: 8px 12px; }
.paso .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.paso.quitado { opacity: .55; }
.paso.tecla { padding: 12px 16px 12px 8px; background: transparent; border-bottom-style: dashed; }
.paso.tecla .num { grid-row: auto; font-size: 25px; line-height: 28px; }
.paso.tecla .que b { font-style: normal; }
.paso.quitado .que b { text-decoration: line-through; }
.chip {
  min-height: 32px; border: 1px solid var(--control); background: none; border-radius: 0;
  padding: 0 12px; font-size: 12px; font-weight: 600; color: var(--texto);
  display: inline-flex; gap: 8px; align-items: center; transition: background 100ms, border-color 100ms;
}
.chip:hover { border-color: var(--texto); background: var(--superficie-2); }
.chip.on { background: var(--texto); border-color: var(--texto); color: var(--fondo); }
.chip .marca-check { width: 14px; height: 14px; border-radius: 0; border: 1.5px solid currentColor; display: grid; place-items: center; }
.chip.on .marca-check { background: var(--foco); border-color: var(--foco); color: var(--papel-900); }
.pista { font-size: 12px; line-height: 16px; color: var(--suave); }
.barra-fija {
  position: sticky; bottom: 0; z-index: 100; margin: 24px calc(-1 * var(--margen)) 0; padding: 16px var(--margen);
  background: var(--fondo); border-top: 1px solid var(--linea);
  display: flex; gap: 12px; align-items: center;
}

/* interruptor */
.opcion { display: flex; gap: 16px; align-items: center; padding: 16px; border: 1px solid var(--linea); background: var(--superficie-2); margin-bottom: 20px; }
.opcion div { flex: 1; }
.opcion b { display: block; }
.opcion small { color: var(--suave); font-size: 12px; line-height: 16px; }
.interruptor { position: relative; width: 48px; height: 26px; flex: none; }
.interruptor input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.interruptor span { position: absolute; inset: 0; background: var(--hundido); border: 1px solid var(--control); transition: background 200ms var(--entra); pointer-events: none; }
.interruptor span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: var(--control); transition: transform 200ms var(--entra), background 200ms; }
.interruptor input:checked + span { background: var(--papel-900); border-color: var(--papel-900); }
.interruptor input:checked + span::after { transform: translateX(22px); background: var(--foco-400); }
.interruptor input:focus-visible + span { outline: 2px solid var(--anillo); outline-offset: 2px; }
.interruptor input:disabled { cursor: not-allowed; }

/* progreso: una medida, en ciclorama */
.progreso { height: 8px; background: var(--linea); overflow: hidden; margin: 20px 0 12px; }
.progreso i { display: block; height: 100%; background: var(--acento); transition: width 300ms var(--entra); }
.fases { display: flex; flex-wrap: wrap; gap: 8px 20px; font: 400 12px/16px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--tenue); margin-top: 12px; }
.fases span.ya { color: var(--bien); }
.fases span.ahora { color: var(--texto); }

video { width: 100%; background: #000; display: block; margin-bottom: 20px; aspect-ratio: 16/10; }
.fila { display: flex; gap: 12px; align-items: center; }
.webs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.web { min-height: var(--control-alto); border: 1px solid var(--control); background: none; border-radius: 0; padding: 0 12px; display: inline-flex; gap: 8px; align-items: center; font-weight: 600; transition: background 100ms, border-color 100ms; }
.web:hover { border-color: var(--texto); background: var(--superficie-2); }
.web.on { border-color: var(--texto); background: var(--texto); color: var(--fondo); }
.marcador { text-align: center; line-height: 1; }
.marcador b { display: block; font-stretch: 66%; font-weight: 850; font-size: 59px; line-height: 56px; color: var(--acento-texto); font-variant-numeric: tabular-nums; }
.marcador small { font: 400 10.5px/12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--suave); }
.ultimo { display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: var(--bien-bg); color: var(--bien-tx); border-left: 4px solid var(--bien); margin-bottom: 16px; font-weight: 600; }
.ultimo.espera { background: var(--superficie-2); color: var(--suave); border-color: var(--linea); font-weight: 400; }
.ultimo.nuevo { animation: destello 300ms var(--entra); }
@keyframes destello { from { box-shadow: 0 0 0 4px var(--foco); } }
.punto-rojo { width: 10px; height: 10px; border-radius: 50%; background: var(--mal); box-shadow: 0 0 0 3px #201F1C33; }

/* la IA y el estreno salen a escena: panel de escenario con foco y tablas, en las dos salas */
#tarjeta-ia, #tarjeta-pensando, .tarjeta:has(video) {
  position: relative; overflow: hidden; background: var(--sala-900); color: var(--sala-50);
  border: 1px solid var(--sala-700); border-top: 4px solid var(--foco-400); padding-bottom: 76px;
  --texto: var(--sala-50); --suave: var(--sala-200); --tenue: var(--sala-300); --linea: #23496B; --control: var(--telon-500);
  --superficie-2: var(--sala-700); --hundido: var(--sala-800); --fondo: var(--sala-900); --acento-texto: var(--cielo-300);
  --bien-bg: #024B1F; --bien-tx: #D6F0DA; --anillo: var(--cielo-300);
}
#tarjeta-ia::before, #tarjeta-pensando::before {
  content: ""; position: absolute; inset: 0 0 56px 0; background: var(--foco-400); opacity: .12;
  clip-path: polygon(70% 0, 82% 0, 100% 100%, 34% 100%); pointer-events: none;
}
#tarjeta-ia::after, #tarjeta-pensando::after, .tarjeta:has(video)::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 56px; border-top: 6px solid var(--papel-900);
  background: repeating-linear-gradient(90deg, var(--tablas-800) 0 138px, var(--papel-900) 138px 140px); pointer-events: none;
}
#tarjeta-ia > *, #tarjeta-pensando > *, .tarjeta:has(video) > * { position: relative; }
#tarjeta-ia h2 { font-size: 44px; line-height: 40px; }
#tarjeta-pensando .marcador b { color: var(--foco-400); font-size: 79px; line-height: 72px; }
#tarjeta-pensando .ultimo { background: #FFFFFF12; color: #fff; border-color: var(--acento); }
#tarjeta-pensando .ultimo.espera { color: var(--sala-200); border-color: var(--sala-700); }
.tarjeta:has(video) { padding-top: 56px; }
.tarjeta:has(video)::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 46px;
  background: radial-gradient(circle at 50% 0, var(--sala-800) 69%, transparent 70%) 0 16px / 44px 26px repeat-x, linear-gradient(var(--sala-800), var(--sala-800)) 0 0 / 100% 16px no-repeat;
}

/* capas: base 0 · sticky 100 · menú 200 · cajón 300 · modal 400 · aviso 500 */
.dialogo-fondo { position: fixed; inset: 0; background: var(--capa); display: grid; place-items: center; z-index: 400; animation: aparece 200ms var(--entra); padding: 16px; }
.dialogo { background: var(--superficie); color: var(--texto); border: 1px solid var(--linea); border-top: 6px solid var(--foco); padding: 24px; width: min(440px, 100%); box-shadow: var(--sombra-3); animation: telon 300ms var(--entra); }
.dialogo p { color: var(--suave); margin: 8px 0 20px; }
@keyframes aparece { from { opacity: 0; } }
/* el telón: lo nuevo aparece de abajo arriba, como cuando sube */
@keyframes telon { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
.vista { animation: telon 300ms var(--entra); }

/* cabecera con acciones */
.titular { display: flex; align-items: flex-start; gap: 12px; }
.titular h1 { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.titular h1 input { font: inherit; letter-spacing: inherit; text-transform: none; width: 100%; border: 1px solid var(--control); padding: 2px 8px; background: var(--hundido); color: var(--texto); }
.menu { position: relative; }
.menu-lista { position: absolute; right: 0; top: 44px; background: var(--superficie); border: 1px solid var(--texto); box-shadow: var(--sombra-3); padding: 4px; min-width: 240px; z-index: 200; animation: aparece 200ms var(--entra); }
.menu-lista button { width: 100%; min-height: 40px; text-align: left; border: 0; background: none; padding: 0 12px; display: flex; gap: 12px; align-items: center; }
.menu-lista button:hover { background: var(--superficie-2); }
.menu-lista button.peligro { color: var(--mal-texto); }
.icono-btn { width: 40px; height: 40px; border: 1px solid var(--linea); background: none; display: grid; place-items: center; color: var(--suave); margin-top: 2px; transition: background 100ms, color 100ms; }
.icono-btn:hover { background: var(--superficie-2); color: var(--texto); }

/* ajustes */
.dialogo.ancho { width: min(600px, 100%); max-height: calc(100vh - 32px); overflow: auto; }
.ajuste { padding: 20px 0; border-top: 1px solid var(--linea); }
.ajuste:first-of-type { border-top: 0; padding-top: 4px; }
.ajuste > b { display: block; margin-bottom: 4px; font-size: 14px; font-weight: 600; }
.ajuste > small { display: block; color: var(--suave); font-size: 12px; line-height: 16px; margin-bottom: 12px; }
.segmentos { display: inline-flex; border: 1px solid var(--control); flex-wrap: wrap; }
.segmentos button { min-height: 38px; border: 0; background: none; padding: 0 16px; font-weight: 600; color: var(--suave); transition: background 100ms, color 100ms; }
.segmentos button + button { border-left: 1px solid var(--control); }
.segmentos button:hover { color: var(--texto); background: var(--superficie-2); }
.segmentos button.on { background: var(--texto); color: var(--fondo); }
input[type=range] { width: 100%; accent-color: var(--acento); }
.escala { display: flex; justify-content: space-between; font-size: 12px; color: var(--suave); margin-top: 4px; }
details summary { cursor: pointer; color: var(--suave); font-weight: 600; min-height: 32px; display: flex; align-items: center; }

/* valor de un campo */
.valor { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; font-size: 12px; color: var(--suave); }
.valor input { flex: 1; min-height: 32px; padding: 4px 8px !important; }

/* aviso flotante (toast) */
#aviso-flotante { position: fixed; left: 50%; bottom: 48px; transform: translateX(-50%) translateY(20px); background: var(--papel-900); color: var(--papel-50); padding: 12px 20px; border-bottom: 4px solid var(--foco-400); box-shadow: var(--sombra-2); opacity: 0; transition: opacity 200ms var(--sale), transform 200ms var(--sale); pointer-events: none; z-index: 500; font-weight: 600; max-width: calc(100vw - 32px); }
#aviso-flotante.ver { opacity: 1; transform: translateX(-50%); transition-timing-function: var(--entra); }
.buscar { margin: 0 16px 8px; }

/* cargando: el esqueleto con la forma real de la vista */
.esqueleto i { display: block; background: var(--superficie-2); margin-bottom: 16px; animation: latido 1.2s infinite; }

/* cajón del programa (tableta y móvil) */
.cortina { display: none; }

/* ---------- tamaños: ancho · escritorio · tableta · móvil ---------- */
@media (max-width: 1023px) {
  :root { --margen: 24px; }
  body { grid-template-columns: minmax(0, 1fr); }
  #btn-programa { display: inline-flex; }
  aside {
    position: fixed; z-index: 300; left: 0; top: 64px; bottom: 0; width: min(320px, 86vw);
    transform: translateX(-100%); transition: transform 300ms var(--sale); box-shadow: var(--sombra-3);
  }
  body.programa-abierto aside { transform: none; transition-timing-function: var(--entra); }
  body.programa-abierto .cortina { display: block; position: fixed; inset: 64px 0 0 0; background: var(--capa); z-index: 250; animation: aparece 200ms var(--entra); }
  .tres { grid-template-columns: minmax(0, 1fr); }
  .tres .acto + .acto { padding-left: 0; border-left: 0; border-top: 1px solid var(--linea); }
  .escena-texto { padding: 64px 12% 0; }
}
@media (max-width: 599px) {
  :root { --margen: 16px; }
  body { grid-template-rows: 56px minmax(0, 1fr) 0; }
  .estado { display: none; }
  .marca { height: 56px; }
  .marca b { font-size: 30px; line-height: 56px; }
  .contexto { display: none; }
  #btn-sala-t { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }   /* solo el foco; el nombre sigue para el lector */
  aside { top: 56px; }
  body.programa-abierto .cortina { inset: 56px 0 0 0; }
  .lienzo { padding-top: 24px; }
  .pasos-guia { margin-top: -24px; padding: 0 40px; height: 88px; }
  .pasos-guia b { font-size: 22px; line-height: 24px; }
  .pasos-guia .n { font-size: 10.5px; }
  .escena { margin-top: -24px; height: 520px; }
  .escena-texto { height: 428px; padding: 56px 24px 0; }
  .paso { grid-template-columns: 44px minmax(0, 1fr); gap: 8px 12px; padding: 16px 12px 16px 4px; }
  .paso .num { font-size: 33px; line-height: 32px; }
  .barra-fija { flex-wrap: wrap; }
  .barra-fija .btn.principal { flex: 1 1 100%; margin-left: 0; order: -1; }
  .botones .btn.grande { flex: 1 1 100%; }
  .tarjeta { padding: 20px 16px; }
  #tarjeta-ia h2 { font-size: 33px; line-height: 32px; }
  .en-vivo { flex-wrap: wrap; }
  input[type=text], input[type=password], textarea, select { font-size: 16px; }   /* sin el zoom de iOS */
}
/* táctil: objetivos de 44 aunque el dibujo sea menor */
@media (pointer: coarse) {
  :root { --control-alto: 44px; }
  .chip { min-height: 44px; }
  .item { min-height: 60px; }
  .enlace, .menu-lista button { min-height: 44px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  .vista, .dialogo { animation: aparece 100ms !important; }
}
@media print {
  body { display: block; overflow: visible; background: #fff; color: #000; }
  .barra-tramoya, aside, .estado, .barra-fija, .pasos-guia { display: none; }
}

let LANG = "en";
const T_ = (k, v) => t(k, v);  // inside grabar() and video() `t` is the task
// The folder of finished videos, by its real name («Mis vídeos», «My videos», «Tramoya»…).
const carpetaNombre = () => String(INICIO.carpeta || "").split(/[\\/]/).filter(Boolean).pop() || (LANG === "es" ? "Mis vídeos" : "My videos");
const t = (k, v = {}) => String((TEXTOS[k] || {})[LANG] ?? (TEXTOS[k] || {}).en ?? k)
  .replace(/\{(\w+)\}/g, (_, n) => n === "carpeta" && v[n] === undefined ? carpetaNombre() : (v[n] ?? ""));
function traducirFijos() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-t-ph]").forEach((el) => { el.placeholder = t(el.dataset.tPh); el.setAttribute("aria-label", t(el.dataset.tPh)); });
  document.querySelectorAll("[data-t-label]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.tLabel)); el.title = t(el.dataset.tLabel); });
  $("#btn-sala-t").textContent = t("sala_iluminada");
}

/* ---------- la sala: a oscuras (por defecto) o iluminada; se recuerda en este equipo ---------- */
function ponerSala(sala) {
  document.documentElement.dataset.sala = sala;
  $("#btn-sala").setAttribute("aria-pressed", String(sala === "iluminada"));
  try { localStorage.setItem("tramoya.sala", sala); } catch { /* sin almacenamiento: solo esta vez */ }
}
let salaGuardada = null;
try { salaGuardada = localStorage.getItem("tramoya.sala"); } catch { salaGuardada = null; }
ponerSala(salaGuardada === "iluminada" ? "iluminada" : "oscuras");
$("#btn-sala").onclick = () => ponerSala(document.documentElement.dataset.sala === "iluminada" ? "oscuras" : "iluminada");

/* ---------- el programa: lateral fijo en escritorio, cajón en tableta y móvil ---------- */
function programa(abrir) {
  document.body.classList.toggle("programa-abierto", abrir);
  $("#btn-programa").setAttribute("aria-expanded", String(abrir));
}
$("#btn-programa").onclick = () => programa(!document.body.classList.contains("programa-abierto"));
$("#cortina").onclick = () => programa(false);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && document.body.classList.contains("programa-abierto")) { programa(false); $("#btn-programa").focus(); } });

/* lo que está en cartel, arriba; y la barra de estado, abajo */
function contexto() {
  $("#contexto-cue").textContent = P ? t("en_cartel") : t("cue_barra");
  $("#contexto").textContent = P ? P.nombre : "";
}
function barraEstado() {
  const a = INICIO.ajustes || {};
  $("#estado-version").textContent = INICIO.version ? t("estado_version", {v: INICIO.version}) : "";
  const voz = INICIO.voces.length ? nombreVoz(vozDelIdioma()) : "";
  $("#estado-voz").textContent = voz ? t("estado_voz", {v: voz}) : "";
  const ia = a.ia_backend === "off" ? t("ia_off") : a.ia_modelo || (a.ia_backend ? a.ia_backend : t("ia_auto"));
  $("#estado-ia").textContent = INICIO.agente || a.ia_backend ? t("estado_ia", {m: ia}) : "";
}

let INICIO = {proyectos: [], voces: [], webs: [], ajustes: {}};
let P = null;              // proyecto abierto
let VISTA = "portada";     // portada | crear | grabar | explicar | video
let sondeo = null;
let guardarTimer = null;

async function cargarInicio() {
  INICIO = await api("/api/inicio");
  LANG = (INICIO.ajustes && INICIO.ajustes.idioma) || INICIO.idioma || "en";
  traducirFijos();
  $("#btn-acceso").classList.toggle("oculto", !INICIO.windows || INICIO.acceso);
  $("#buscar").classList.toggle("oculto", INICIO.proyectos.length < 7);
  pintarLista();
  barraEstado();
  contexto();
}

let avisoTimer = null;
function avisar(texto) {
  const a = $("#aviso-flotante");
  a.textContent = texto; a.classList.add("ver");
  clearTimeout(avisoTimer); avisoTimer = setTimeout(() => a.classList.remove("ver"), 2600);
}

const nombreVoz = (v) => (v || "").split(" - ")[0].replace("Microsoft ", "").replace(" Desktop", "");
// «Microsoft Zira Desktop - English (United States)»: el idioma va después del guion.
const vozEs = (v, lang) => new RegExp(lang === "es" ? "Spanish|Español|espa" : "English|Inglés|ingl", "i").test((v || "").split(" - ")[1] || "");
const vozDelIdioma = () => INICIO.ajustes.voz || INICIO.voces.find((v) => vozEs(v, LANG)) || INICIO.voces[0];

function pintarLista() {
  const l = $("#lista");
  const vivos = INICIO.proyectos.filter((p) => ["abriendo", "preparado", "grabando", "pensando", "haciendo"].includes(p.tarea));
  $("#en-vivo-lateral").classList.toggle("oculto", !vivos.length);
  $("#en-vivo-lateral span").textContent = vivos.map((p) => p.nombre).join(" · ");
  if (!INICIO.proyectos.length) { l.innerHTML = `<div class="vacio-lista"><b>${t("ninguno_aun")}</b>${t("ninguno_aun_sub")}</div>`; return; }
  const f = ($("#filtro").value || "").trim().toLowerCase();
  const lista = INICIO.proyectos.filter((p) => !f || p.nombre.toLowerCase().includes(f));
  if (!lista.length) { l.innerHTML = `<div class="vacio-lista">${t("ninguno_asi")}</div>`; return; }
  l.innerHTML = lista.map((p) => {
    const vivo = ["abriendo", "preparado", "grabando", "pensando", "haciendo"].includes(p.tarea);
    const estado = vivo ? t("en_marcha") : p.video ? t("video_listo") : p.fase === "explicar" ? t("faltan_frases") : t("sin_grabar");
    const forma = vivo ? "vivo" : p.video ? "listo" : p.fase === "explicar" ? "falta" : "";
    const actual = P && P.id === p.id;
    return `<button class="item ${actual ? "activo" : ""}" data-id="${esc(p.id)}" ${actual ? 'aria-current="page"' : ""}>
      <span>${esc(p.nombre)}<small><i class="punto ${forma}" aria-hidden="true"></i>${estado}</small></span></button>`;
  }).join("");
  l.querySelectorAll(".item").forEach((b) => b.onclick = () => { programa(false); abrir(b.dataset.id); });
}

async function abrir(id, vista) {
  P = await api(`/api/p/${id}`);
  VISTA = vista || (P.tarea.estado === "haciendo" || P.video ? "video" : P.pasos.length ? "explicar" : "grabar");
  if (["abriendo", "preparado", "grabando", "pensando", "convirtiendo"].includes(P.tarea.estado)) VISTA = "grabar";
  pintar();
  pintarLista();
}

function guia() {
  const orden = ["grabar", "explicar", "video"];
  const nombres = {grabar: t("grabar"), explicar: t("explicar"), video: t("video")};
  const actual = orden.indexOf(VISTA);
  const alcanzable = (v) => v === "grabar" || (v === "explicar" && P.pasos.length) || (v === "video" && P.pasos.length);
  return `<ol class="pasos-guia">${orden.map((v, i) => {
    const cls = i === actual ? "ahora" : alcanzable(v) && i < actual ? "hecho" : alcanzable(v) ? "hecho" : "";
    return `<li class="${cls}" data-v="${v}"><span class="n">${i < actual ? "✓ " : ""}${t("acto")} ${["I", "II", "III"][i]}</span><b>${nombres[v]}</b></li>`;
  }).join("")}</ol>`;
}

function enlazarGuia() {

function pintar() {

function nombreWeb(url) {
  const w = (INICIO.webs || []).find((x) => x.url === url);

}

async function refrescar() {
  const antes = P.tarea?.estado;
  P = await api(`/api/p/${P.id}`);
  if (VISTA === "grabar" && antes !== "quieto" && P.tarea.estado === "quieto" && P.fase === "explicar") VISTA = "explicar";
  if (VISTA === "video" && P.tarea.estado === "error" && P.tarea.paso) { /* se queda para enseñar el error */ }
  pintar();
  cargarInicio();
}

function vigilar() {
  let ultimo = JSON.stringify(P.tarea);
  sondeo = setInterval(async () => {
    const q = await api(`/api/p/${P.id}`);
    const ahora = JSON.stringify(q.tarea);
    if (ahora !== ultimo) {
      ultimo = ahora;
      if (VISTA === "video" && q.tarea.estado === "haciendo") {
        P = q; actualizarProgreso(); return;
      }
      if (VISTA === "grabar" && q.tarea.estado === "grabando" && P.tarea.estado === "grabando" && $(".marcador")) {
        P = q;
        $(".marcador b").textContent = q.tarea.n || 0;
        $(".marcador small").textContent = (q.tarea.n || 0) === 1 ? t("paso") : t("pasos");
        const u = $(".ultimo");
        u.classList.remove("espera", "nuevo"); void u.offsetWidth; u.classList.add("nuevo");
        u.innerHTML = `${ico("bien")}<span>${esc(q.tarea.ultimo || "")}</span>`;
        return;
      }
      if (VISTA === "grabar" && q.tarea.estado === "pensando" && P.tarea.estado === "pensando" && $("#tarjeta-pensando")) {
        const cambioPaso = (q.tarea.n || 0) !== (P.tarea.n || 0);
        P = q;
        $(".marcador b").textContent = q.tarea.n || 0;
        $(".marcador small").textContent = (q.tarea.n || 0) === 1 ? t("paso") : t("pasos");
        $("#barra").style.width = Math.round((q.tarea.p || 0) * 100) + "%";
        const u = $("#msg");
        u.classList.toggle("espera", !(q.tarea.n > 0));
        if (cambioPaso) { u.classList.remove("nuevo"); void u.offsetWidth; u.classList.add("nuevo"); }
        u.innerHTML = `${ico(q.tarea.n > 0 ? "bien" : "bombilla")}<span>${esc(q.tarea.msg || t("pensando"))}</span>`;
        return;
      }
      const antes = P.tarea.estado;
      P = q;
      if (VISTA === "grabar" && q.tarea.estado === "quieto" && q.fase === "explicar" && antes !== "quieto") VISTA = "explicar";
      pintar(); cargarInicio();
    }
  }, 900);
}

function explicar(v) {
  const pasos = P.pasos;
  const fallo = P.tarea?.estado === "error" ? P.tarea.paso : null;
  const avisos = (P.avisos || []).map((a) => `<p>${esc(a)}</p>`).join("");
  v.innerHTML = cabecera(t("escribe_que"), t("paso2de3"))
    + (avisos ? `<div class="aviso info">${ico("info")}<div>${avisos}</div></div>` : "")

      <button class="btn discreto" id="regrabar">${ico("volver")} ${t("volver_grabar")}</button>
      <button class="btn principal grande derecha" id="seguir">${t("siguiente_video")}</button>
    </div>`;
  enlazarGuia();
  enlazarCabecera();
  const caja = $("#pasos");
  caja.querySelectorAll("textarea").forEach((ta) => { crecer(ta); ta.oninput = () => { crecer(ta); cambiar(ta.closest(".paso"), "texto", ta.value); }; });
  caja.oninput = (e) => { if (e.target.matches("[data-valor]")) cambiarValor(e.target); };
  caja.onclick = (e) => {
    const b = e.target.closest("button[data-a]"); if (!b) return;
    const el = b.closest(".paso"), p = pasoDe(el);
    if (b.dataset.a === "seguro") cambiar(el, "seguro", !p.seguro, true);
    if (b.dataset.a === "quitar") cambiar(el, "quitado", !p.quitado, true);
    if (b.dataset.a === "oir") { api("/api/oir", {texto: p.texto}); return; }
    if (b.dataset.a === "usar") { const ta = $("textarea", el); ta.value = sugerencia(p); crecer(ta); cambiar(el, "texto", ta.value); ta.focus(); }
  };
  contar();
  $("#regrabar").onclick = () => { VISTA = "grabar"; P.tarea = {estado: "quieto"}; pintar(); };
  $("#seguir").onclick = async () => { await guardarYa(); VISTA = "video"; P.tarea = {estado: "quieto"}; pintar(); };
  if (fallo) { const el = caja.querySelector(`[data-id="${fallo}"]`); if (el) el.scrollIntoView({block: "center"}); }
  else { const primera = caja.querySelector("textarea"); if (primera && !pasos.some((p) => p.texto)) primera.focus(); }
}

function pasoHTML(p) {
  if (p.tipo === "tecla") {
    return `<div class="paso tecla ${p.quitado ? "quitado" : ""}" data-id="${p.id}">
      <div class="num">${String(p.id).padStart(2, "0")}</div>
      <div class="que"><span style="color:var(--suave)">${ico("tecla")}</span><b>${esc(p.desc)}</b>
        <button class="chip" data-a="quitar">${p.quitado ? ico("volver", 13) + " " + t("recuperar") : ico("quitar", 13) + " " + t("quitar")}</button></div></div>`;
  }
  const fallo = P.tarea?.estado === "error" && P.tarea.paso === p.id;
  const seguro = p.tipo === "clic" ? `<button class="chip ${p.seguro ? "on" : ""}" data-a="seguro" title="${t("seguro_title")}">
      <span class="marca-check">${p.seguro ? '<svg width="9" height="9" viewBox="0 0 10 10"><path d="m2 5 2 2 4-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>' : ""}</span>
      ${t("solo_senalar")}</button>` : "";
  return `<div class="paso ${p.texto ? "con-texto" : ""} ${p.quitado ? "quitado" : ""} ${fallo ? "fallo" : ""}" data-id="${p.id}">
    <div class="num">${String(p.id).padStart(2, "0")}</div>
    <div class="que"><span style="color:var(--suave)">${ico(p.tipo)}</span><b>${esc(p.desc)}</b></div>
    <div>
      ${fallo ? `<div class="aviso mal" style="margin:6px 0 10px">${ico("mal")}<p>${esc(P.tarea.msg)} ${t("fallo_paso")}</p></div>` : ""}
      ${p.tipo === "escribir" && !p.quitado ? `<label class="valor">${t("se_escribe")}<input type="text" data-valor value="${esc(p.valor)}" spellcheck="false"></label>` : ""}
      <textarea rows="1" maxlength="260" placeholder="${t("que_pone")}" ${p.quitado ? "disabled" : ""}>${esc(p.texto || "")}</textarea>
      <div class="acciones">
        ${p.quitado ? "" : seguro}
        ${p.quitado || p.texto ? "" : `<button class="chip" data-a="usar" title="${esc(sugerencia(p))}">${ico("lapiz", 13)} ${t("escribir_lo_que")}</button>`}
        ${!p.quitado && p.texto && INICIO.voces.length ? `<button class="chip" data-a="oir">${ico("altavoz", 13)} ${t("escuchar")}</button>` : ""}
        <button class="chip derecha" data-a="quitar">${p.quitado ? ico("volver", 13) + " " + t("recuperar") : ico("quitar", 13) + " " + t("quitar_paso")}</button>
      </div>
    </div></div>`;
}

function sugerencia(p) {
  return p.desc.replace(/^Pulsa (el botón|el enlace|la pestaña) /, "Pulsa ").replace(/ en el campo «/, " en «")
    .replace(/^Click the (“[^”]*”) (button|link|tab)$/, "Click $1").replace(/ in the (“[^”]*”) field$/, " in $1");
}

const pasoDe = (el) => P.pasos.find((p) => p.id === Number(el.dataset.id));

function cambiar(el, clave, valor, repintar) {
  const p = pasoDe(el);
  p[clave] = valor;
  if (clave === "texto") {
    el.classList.toggle("con-texto", !!valor.trim());
    const tiene = !!$('[data-a="oir"]', el), quiere = !!valor.trim() && INICIO.voces.length > 0;
    if (tiene !== quiere) repintar = true;
  }
  if (repintar) {
    const nuevo = document.createElement("div");
    nuevo.innerHTML = pasoHTML(p);
    const n = nuevo.firstElementChild;
    el.replaceWith(n);
    n.querySelectorAll("textarea").forEach((ta) => {
      crecer(ta); ta.oninput = () => { crecer(ta); cambiar(n, "texto", ta.value); };
      if (clave === "texto") { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    });
  }
  contar();
  clearTimeout(guardarTimer);
  guardarTimer = setTimeout(guardarYa, 500);
}

async function guardarYa() {
  clearTimeout(guardarTimer);
  await api(`/api/p/${P.id}/guardar`, {pasos: P.pasos});
}

function contar() {
  const c = $("#contador"); if (!c) return;
  const vivos = P.pasos.filter((p) => !p.quitado);
  const con = vivos.filter((p) => (p.texto || "").trim()).length;
  c.textContent = t("contador", {n: vivos.length, c: con});
}

function cambiarValor(input) {
  const el = input.closest(".paso"), p = pasoDe(el);
  if (p.valor_grabado === undefined) p.valor_grabado = p.valor;
  p.valor = input.value;
  // Los pasos de después que encuentran algo por ese texto (la fila de lo que se acaba
  // de escribir, por ejemplo) lo buscan ya con el valor nuevo.
  P.pasos.forEach((q, i) => {
    if (!q.selector) return;
    if (q.selector_grabado === undefined) q.selector_grabado = q.selector;
    let sel = q.selector_grabado;
    P.pasos.slice(0, i).forEach((r) => {
      if (r.valor_grabado && r.valor_grabado.length >= 2 && r.valor !== r.valor_grabado) sel = sel.split(r.valor_grabado).join(r.valor);
    });
    q.selector = sel;
  });
  p.desc = p.desc.replace(/^Escribe «.*?»/, `Escribe «${input.value}»`).replace(/^Type “.*?”/, `Type “${input.value}”`);
  $(".que b", el).textContent = p.desc;
  clearTimeout(guardarTimer);
  guardarTimer = setTimeout(guardarYa, 500);
}

function crecer(ta) { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + 2 + "px"; }

/* ---------- vídeo ---------- */
function video(v) {
  const t = P.tarea || {estado: "quieto"};
  const hayVoz = INICIO.voces.length > 0;
  const conTexto = P.pasos.filter((p) => !p.quitado && (p.texto || "").trim()).length;
  let cuerpo;
  if (t.estado === "haciendo") {
    cuerpo = `<div class="tarjeta">
      <div class="en-vivo"><div class="anillo"></div><div><h2 style="margin:0" id="msg">${esc(t.msg || T_("empezando"))}</h2>
      <span class="pista">${T_("se_mueve")}</span></div></div>
      <div class="progreso"><i id="barra" style="width:${Math.round((t.p || 0) * 100)}%"></i></div>
      <div class="fases" id="fases"></div>
      <div class="botones" style="margin-top:20px"><button class="btn discreto" id="cancelar">${T_("cancelar")}</button></div></div>`;
  } else if (P.video && t.estado !== "error") {
    cuerpo = `${t.estado === "listo" ? `<div class="aviso bien">${ico("bien")}<p>${T_("listo_video")}</p></div>` : ""}
      <div class="tarjeta">
      <video controls src="/video/${esc(P.id)}.mp4?${Date.now()}"></video>
      <div class="botones">
        <button class="btn principal" id="ver">${ico("play")} ${T_("abrir_video")}</button>
        <button class="btn" id="carpeta">${ico("carpeta")} ${T_("mostrar_carpeta")}</button>
        <button class="btn discreto derecha" id="cambiar">${ico("lapiz")} ${T_("cambiar_rehacer")}</button>
      </div>
      ${P.hecho ? `<p class="pista" style="margin:14px 0 0">${T_("hecho_el", {f: esc(P.hecho)})}${P.voz ? T_("con_voz_min") : ""}.${P.srt ? T_("srt_junto") : ""}</p>` : ""}
      ${P.aviso ? `<p class="pista" style="margin:8px 0 0">${esc(P.aviso)}</p>` : ""}</div>`;
  } else {
    const error = t.estado === "error" ? `<div class="aviso mal">${ico("mal")}<div><p>${esc(t.msg)}</p>
      ${t.paso ? `<p><button class="btn" id="ir-paso" style="margin-top:8px">${T_("ir_paso")}</button></p>` : ""}</div></div>` : "";
    cuerpo = `${error}<div class="tarjeta">
      ${conTexto ? "" : `<div class="aviso info">${ico("info")}<p>${T_("sin_texto")}</p></div>`}
      <div class="opcion">
        <div><b>${T_("con_voz")}</b><small>${hayVoz ? T_("voz_lee", {v: esc(nombreVoz(vozDelIdioma()))}) : T_("sin_voces")}</small></div>
        <label class="interruptor"><input type="checkbox" id="voz" ${hayVoz && P.voz !== false ? "checked" : ""} ${hayVoz ? "" : "disabled"} aria-label="${T_("con_voz")}"><span></span></label>
      </div>
      <ol class="lista-num">
        <li><span>${T_("hace1")}</span></li>
        <li><span>${T_("hace2")}</span></li>
        <li><span>${T_("hace3")}</span></li>
      </ol>
      <div class="botones"><button class="btn principal grande" id="hacer">${ico("peli", 18)} ${T_("hacer_video")}</button>
        <button class="btn discreto" id="atras">${T_("volver_textos")}</button></div></div>`;
  }
  v.innerHTML = cabecera(esc(P.nombre), T_("paso3de3")) + cuerpo;
  enlazarGuia();
  enlazarCabecera();
  const on = (id, fn) => { const b = $("#" + id); if (b) b.onclick = fn; };
  on("hacer", async () => { await api(`/api/p/${P.id}/video`, {voz: $("#voz").checked}); refrescar(); });
  on("cancelar", async () => { await api(`/api/p/${P.id}/cancelar`, {}); refrescar(); });
  on("ver", () => api(`/api/p/${P.id}/abrir`, {que: "video"}));
  on("carpeta", () => api(`/api/p/${P.id}/abrir`, {que: "carpeta"}));
  on("cambiar", () => { VISTA = "explicar"; P.tarea = {estado: "quieto"}; pintar(); });
  on("atras", () => { VISTA = "explicar"; pintar(); });
  on("ir-paso", () => { VISTA = "explicar"; pintar(); });
  on("a-textos", (e) => { e.preventDefault(); VISTA = "explicar"; pintar(); });
  on("a-ajustes", (e) => { e.preventDefault(); ajustes(); });
  if (t.estado === "haciendo") { actualizarProgreso(); vigilar(); }
}

function actualizarProgreso() {
  const t = P.tarea, b = $("#barra"); if (!b) return pintar();
  b.style.width = Math.round((t.p || 0) * 100) + "%";
  $("#msg").textContent = t.msg || "";
  const fases = [["voz", T_("fase_voz"), P.voz], ["grabar", T_("fase_grabar"), true], ["montar", T_("fase_montar"), true]].filter((f) => f[2]);
  const actual = t.p >= .8 ? "montar" : t.p >= .15 ? "grabar" : "voz";
  const idx = fases.findIndex((f) => f[0] === actual);
  $("#fases").innerHTML = fases.map((f, i) => `<span class="${i < idx ? "ya" : i === idx ? "ahora" : ""}">${i < idx ? "✓ " : ""}${f[1]}</span>`).join("");
}

/* ---------- ajustes ---------- */
function ajustes() {
  const a = {...INICIO.ajustes};
  if (!a.idioma) a.idioma = LANG;
  const d = document.createElement("div");
  d.className = "dialogo-fondo";
  const seg = (clave, opciones) => `<div class="segmentos" data-clave="${clave}">${opciones.map(([v, t]) =>
    `<button data-v="${v}" class="${String(a[clave] ?? "") === v ? "on" : ""}">${t}</button>`).join("")}</div>`;
  d.innerHTML = `<div class="dialogo ancho" role="dialog" aria-modal="true" aria-label="${t("ajustes")}"><h2>${t("ajustes")}</h2>
    <p style="margin-bottom:8px">${t("valen_todos")}</p>
    <div class="ajuste"><b>${t("idioma")}</b><small>${t("idioma_sub")}</small>
      ${seg("idioma", [["en", "English"], ["es", "Español"]])}</div>
    <div class="ajuste" id="a-ia"><b>${t("ia")}</b><small>${t("ia_sub")}</small>

      <small class="ia-solo" data-para="off" style="margin-top:8px">${t("ia_off_sub")}</small>
      <label class="campo ia-solo" data-para="ollama openai" style="margin-top:12px"><span id="a-ia-url-t"></span>

      <label class="campo ia-solo" data-para="ollama claude openai"><span>${t("ia_modelo")}</span>
        <div style="display:flex;gap:8px"><input type="text" id="a-ia-modelo" list="a-ia-lista" value="${esc(a.ia_modelo || "")}" placeholder="${t("ia_modelo_ph")}" spellcheck="false" style="flex:1">
        <button class="btn" id="a-ia-cargar" type="button">${t("ia_cargar")}</button></div>
        <datalist id="a-ia-lista"></datalist><small id="a-ia-n"></small></label>
      <label class="campo ia-solo" data-para="claude openai"><span>${t("ia_clave")}</span>
        <input type="password" id="a-ia-clave" autocomplete="off" placeholder="${t("ia_clave_ph")}" spellcheck="false">
        <small>${a.ia_clave_guardada ? t("ia_clave_guardada", {fin: esc(a.ia_clave_fin || "")}) + ` <a href="#" id="a-ia-borrar">${t("ia_clave_borrar")}</a>` : t("ia_clave_nota")}</small></label>
      <div class="ia-solo" data-para=" ollama claude openai" style="margin-top:4px"><button class="btn" id="a-ia-probar" type="button">${ico("bombilla")} ${t("ia_probar")}</button>
        <p class="pista" id="a-ia-resultado" style="margin:10px 0 0"></p></div></div>
    ${INICIO.voces.length ? `<div class="ajuste"><b>${t("voz")}</b><small>${t("voz_sub")}</small>
      <select id="a-voz">${INICIO.voces.map((v) => `<option value="${esc(v)}" ${v === (a.voz || vozDelIdioma()) ? "selected" : ""}>${esc(nombreVoz(v))} · ${esc((v.split(" - ")[1] || "").trim())}</option>`).join("")}</select>
      <div style="margin-top:14px"><b style="font-weight:500">${t("velocidad")}</b>
        <input type="range" id="a-vel" min="-5" max="5" step="1" value="${a.velocidad || 0}" aria-label="${t("velocidad")}">
        <div class="escala"><span>${t("mas_despacio")}</span><span>${t("normal")}</span><span>${t("mas_deprisa")}</span></div></div>
      <button class="btn" id="a-probar" style="margin-top:10px">${ico("altavoz")} ${t("probar_voz")}</button></div>` : ""}
    <div class="ajuste"><b>${t("ritmo")}</b><small>${t("ritmo_sub")}</small>
      ${seg("ritmo", [["tranquilo", t("tranquilo")], ["normal", t("normal")], ["agil", t("agil")]])}</div>
    <div class="ajuste"><b>${t("tamano")}</b><small>${t("tamano_sub")}</small>
      ${seg("tamano", [["720p", "HD (1280×720)"], ["800p", t("portatil")], ["1080p", "Full HD (1920×1080)"]])}</div>
    <div class="ajuste"><b>${t("acabado")}</b><small>${t("acabado_sub")}</small>
      ${seg("acabado", [["estreno", t("acabado_estreno")], ["bruto", t("acabado_bruto")]])}</div>
    <div class="ajuste"><b>${t("formato")}</b><small>${t("formato_sub")}</small>
      ${seg("formato", [["horizontal", t("horizontal")], ["vertical", t("vertical")]])}</div>
    <div class="ajuste"><b>${t("duracion")}</b><small>${t("duracion_sub")}</small>
      ${seg("duracion", [["0", t("sin_limite")], ["30", "30 s"], ["60", "1 min"], ["90", "1:30"], ["120", "2 min"]])}</div>
    <div class="ajuste"><b>${t("musica")}</b><small>${t("musica_sub", {c: esc(INICIO.carpeta_pistas || "")})}</small>
      ${seg("musica", [["ascensor", t("ascensor")], ...(INICIO.pistas || []).map((n) => [n, esc(n)]), ...((INICIO.pistas || []).length ? [["aleatoria", t("aleatoria")]] : []), ["ninguna", t("sin_musica")]])}</div>
    <div class="ajuste"><div class="opcion" style="margin:0"><div><b>${t("srt")}</b><small>${t("srt_sub")}</small></div>

  document.body.append(d);
  d.querySelectorAll(".segmentos").forEach((g) => g.onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    a[g.dataset.clave] = b.dataset.v;
    g.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    // Al cambiar de idioma, la voz pasa a una de ese idioma si la que había era de otro.
    if (g.dataset.clave === "idioma" && $("#a-voz", d)) {
      const sel = $("#a-voz", d);
      if (!vozEs(sel.value, b.dataset.v)) { const otra = INICIO.voces.find((v) => vozEs(v, b.dataset.v)); if (otra) sel.value = otra; }
    }
  });
  const leer = () => {
    if ($("#a-voz", d)) { a.voz = $("#a-voz", d).value; a.velocidad = Number($("#a-vel", d).value); }

    a.ia_url = $("#a-ia-url", d).value.trim(); a.ia_modelo = $("#a-ia-modelo", d).value.trim();
    a.ia_clave = $("#a-ia-clave", d).value.trim();
  };
  // --- the AI section: which fields show, the model list, the test

    const b = a.ia_backend || "";
    d.querySelectorAll(".ia-solo").forEach((el) => {
      const para = el.dataset.para.split(" ");
      el.style.display = (b === "" ? para.includes("") : para.includes(b)) ? "" : "none";
    });
    $("#a-ia-url-t", d).textContent = b === "openai" ? t("ia_url_openai") : t("ia_url_ollama");
    $("#a-ia-url", d).placeholder = b === "openai" ? "http://127.0.0.1:1234/v1" : "http://localhost:11434";
  };
  const borrador = () => ({ia_backend: a.ia_backend || "", ia_url: $("#a-ia-url", d).value.trim(),
    ia_modelo: $("#a-ia-modelo", d).value.trim(), ia_clave: $("#a-ia-clave", d).value.trim()});
  const cargarModelos = async () => {
    const r = await api("/api/ia/modelos", borrador());
    const n = $("#a-ia-n", d);
    if (r.error) { n.textContent = t("ia_mal", {e: r.error}); return; }
    $("#a-ia-lista", d).innerHTML = (r.modelos || []).map((m) => `<option value="${esc(m)}">`).join("");
    n.textContent = t("ia_modelos_n", {n: (r.modelos || []).length});
    if (!$("#a-ia-modelo", d).value && r.modelo) $("#a-ia-modelo", d).placeholder = r.modelo;
  };
  $("#a-ia-cargar", d).onclick = cargarModelos;
  $("#a-ia-probar", d).onclick = async () => {
    const res = $("#a-ia-resultado", d);
    res.textContent = t("ia_probando");
    const r = await api("/api/ia/probar", borrador());
    res.textContent = r.ok ? "✓ " + t("ia_ok", {m: r.modelo, s: (r.ms / 1000).toFixed(1), r: r.respuesta}) : "✗ " + t("ia_mal", {e: r.error});
  };
  const borrar = $("#a-ia-borrar", d);
  if (borrar) borrar.onclick = (e) => { e.preventDefault(); a.ia_clave_borrar = true; borrar.parentElement.textContent = t("ia_clave_nota"); };
  let antes = a.ia_backend || "";
  d.querySelector('.segmentos[data-clave="ia_backend"]').addEventListener("click", () => {
    // The model and the address belong to the backend they were written for.
    if ((a.ia_backend || "") !== antes) { $("#a-ia-modelo", d).value = ""; $("#a-ia-url", d).value = ""; antes = a.ia_backend || ""; }
    iaVista(); $("#a-ia-lista", d).innerHTML = ""; $("#a-ia-n", d).textContent = ""; $("#a-ia-resultado", d).textContent = "";
    if (["ollama", "openai"].includes(a.ia_backend || "")) cargarModelos();
  });
  iaVista();
  if (["", "ollama"].includes(a.ia_backend || "")) cargarModelos();

  const probar = $("#a-probar", d);
  if (probar) probar.onclick = async () => {
    leer();
    await api("/api/ajustes", {voz: a.voz, velocidad: a.velocidad});
    api("/api/oir", {texto: TEXTOS.hola_voz[a.idioma || LANG] || TEXTOS.hola_voz.en});
  };
  const cerrar = () => { d.remove(); document.removeEventListener("keydown", tecla); };
  const tecla = (e) => { if (e.key === "Escape") cerrar(); };
  document.addEventListener("keydown", tecla);
  $("#a-no", d).onclick = cerrar;
  d.onclick = (e) => { if (e.target === d) cerrar(); };
  $("#a-ok", d).onclick = async () => {
    leer(); INICIO.ajustes = await api("/api/ajustes", a); cerrar();
    LANG = INICIO.ajustes.idioma || LANG; await cargarInicio(); avisar(t("ajustes_ok")); pintar();
  };
}

/* ---------- diálogo ---------- */
function confirmar(titulo, texto, si, fn) {
  const d = document.createElement("div");
  d.className = "dialogo-fondo";
  d.innerHTML = `<div class="dialogo" role="dialog" aria-modal="true"><h2>${esc(titulo)}</h2><p>${esc(texto)}</p>
    <div class="botones"><button class="btn principal" id="d-si">${esc(si)}</button><button class="btn discreto" id="d-no">${t("cancelar")}</button></div></div>`;
  document.body.append(d);
  const cerrar = () => { d.remove(); document.removeEventListener("keydown", tecla); };
  const tecla = (e) => { if (e.key === "Escape") cerrar(); };
  document.addEventListener("keydown", tecla);
  $("#d-no", d).onclick = cerrar;
  d.onclick = (e) => { if (e.target === d) cerrar(); };
  $("#d-si", d).onclick = () => { cerrar(); fn(); };
  $("#d-si", d).focus();
}

$("#btn-ajustes").onclick = () => { programa(false); ajustes(); };
$("#filtro").oninput = pintarLista;
$("#btn-acceso").onclick = async () => {
  const r = await api("/api/acceso", {});
  if (r.error) return avisar(r.error);
  INICIO.acceso = true; $("#btn-acceso").classList.add("oculto"); avisar(t("escritorio_ok"));
};
$("#btn-nuevo").onclick = () => { programa(false); P = null; VISTA = "crear"; pintar(); pintarLista(); };
$("#btn-carpeta").onclick = () => P ? api(`/api/p/${P.id}/abrir`, {que: "carpeta"}) : fetch("/api/carpeta", {method: "POST"});

(async () => {
  await cargarInicio();
  if (INICIO.proyectos.length) abrir(INICIO.proyectos[0].id); else pintar();
})();
</script>
</body>
</html>
